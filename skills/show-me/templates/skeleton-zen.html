<!DOCTYPE html>
<!--
  show-me 骨架模板 · 留白卷  skeleton-zen.html
  ────────────────────────────────────────────────
  什么时候用：面向情绪、留白、一句话观点的表达
  版式语言：窄栏 · 大间距 · 细线

  结构：顶部控制条（骨架 / 内容）→ stage 按 LAYOUT.zen 渲染 → 8 类内容数据 TYPES。
  改：
    1. 换内容：改 TYPES 里对应类型的 title / dek / blocks，块类型见 blockDOM
    2. 换配色 / 字号 / 字体：改 body[data-theme="zen"] 的 --c-* / --fs-* / --ff-* 变量
    3. 改布局：改 LAYOUT.zen 函数（DOM 结构）与对应的 CSS 段
    4. 动效：底层是一套 Three.js 粒子引擎（applyScene 按主题换色），四类骨架共用
  硬约束：单文件、内联 Three.js 无外链、禁 innerHTML、prefers-reduced-motion 已兜底。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>show-me 模板 · 留白卷</title>
<style>
:root{--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --serif:Georgia,"Songti SC","STSong",serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--ff-body);font-size:var(--fs-body);line-height:1.75;
  background:var(--c-bg);color:var(--c-fg);-webkit-font-smoothing:antialiased}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:2;min-height:100svh;background:var(--veil)}
.ctrl{position:sticky;top:0;z-index:20;padding:10px 24px 0;background:var(--bar);
  border-bottom:1px solid var(--c-line);backdrop-filter:blur(12px)}
.ctrl .row{display:flex;align-items:center;gap:10px;max-width:1120px;margin:0 auto 9px}
.ctrl .lab{flex:0 0 auto;font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--c-fg2)}
.ctrl .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
.ctrl .tabs::-webkit-scrollbar{display:none}
.ctrl button{cursor:pointer;flex:0 0 auto;border:1px solid var(--c-line);background:transparent;color:var(--c-fg2);
  font:600 12px/1 var(--sans);padding:8px 12px;border-radius:7px;white-space:nowrap;transition:background .2s,color .2s}
.ctrl button[aria-current="true"]{color:var(--c-bg);background:var(--c-accent);border-color:var(--c-accent)}
.ctrl .note{flex:0 0 auto;font:600 10px/1 var(--mono);color:var(--c-accent);letter-spacing:.06em}
b,strong{font-weight:700;color:var(--c-fg)}

/* ── 1 终端仪表盘：状态条 + 导轨 + 栅格卡 ── */
body[data-theme="tech"]{
 --ff-head:var(--sans);--ff-body:var(--sans);
 --fs-hero:clamp(30px,4.4vw,44px);--fs-h2:18px;--fs-body:15px;--fs-meta:11px;
 --c-bg:#090d14;--c-panel:#111823;--c-line:#273345;--c-fg:#e8eef6;--c-fg2:#94a3b6;--c-fg3:#5d6b7d;
 --c-accent:#00b4ff;--c-accent2:#ff3b5c;
 --bar:rgba(9,13,20,.88);--veil:linear-gradient(90deg,rgba(9,13,20,.94),rgba(9,13,20,.58) 80%,rgba(9,13,20,.4))}
body[data-theme="tech"] .stage{max-width:1120px;margin:0 auto;padding:30px 28px 80px}
.tech-bar{display:flex;align-items:center;gap:12px;font:600 10px/1 var(--mono);letter-spacing:.14em;
  color:var(--c-fg3);border-bottom:1px solid var(--c-line);padding-bottom:14px;margin-bottom:26px}
.tech-bar .on{margin-left:auto;color:var(--c-accent)}
.tech-bar .on i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c-accent);margin-right:6px}
.tech-layout{display:grid;grid-template-columns:56px 1fr;gap:26px}
.tech-rail{border-right:1px solid var(--c-line);padding-right:14px;display:flex;flex-direction:column;gap:2px}
.tech-rail span{font:600 10px/1 var(--mono);color:var(--c-fg3);padding:7px 0;border-bottom:1px dotted var(--c-line)}
.tech-rail span.here{color:var(--c-accent);font-weight:800}
.tech-head{border-left:3px solid var(--c-accent);padding-left:20px;margin-bottom:26px}
.tech-head .ix{font:700 12px/1 var(--mono);letter-spacing:.12em;color:var(--c-accent2);margin-bottom:12px}
.tech-head h1{font:750 var(--fs-hero)/1.16 var(--sans);letter-spacing:-.03em;margin:0 0 14px}
.tech-head .dek{font-size:15px;color:var(--c-fg2);margin:0;max-width:44em}
.tech-blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-items:start}
.tech-blocks>*{background:var(--c-panel);border:1px solid var(--c-line);border-radius:9px;padding:20px}
.tech-blocks>.b-sec,.tech-blocks>.b-band,.tech-blocks>.b-eq,.tech-blocks>.b-quote,.tech-blocks>.b-takeaway,
.tech-blocks>.b-timeline,.tech-blocks>.b-steps,.tech-blocks>.b-table,.tech-blocks>.b-metrics,
.tech-blocks>.b-vs,.tech-blocks>.b-nodes{grid-column:1/-1}
.tech-blocks>.b-sec{background:transparent;border:0;border-bottom:1px solid var(--c-line);border-radius:0;padding:8px 0;
  font:600 11px/1 var(--mono);letter-spacing:.14em;color:var(--c-accent)}
.tech-blocks>.b-band p{margin:0 0 10px;color:var(--c-fg2)}
.tech-blocks>.b-band p:last-child{margin:0}
.tech-blocks>.b-eq{text-align:center;font:600 24px/1.5 var(--mono);color:var(--c-accent);letter-spacing:.04em}
.tech-blocks>.b-quote{font:650 26px/1.7 var(--sans);color:var(--c-accent);border-left:4px solid var(--c-accent2)}
.tech-blocks>.b-specs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
.tech-blocks>.b-specs>div{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px dotted var(--c-line)}
.tech-blocks>.b-specs b{font:750 30px/1 var(--mono);color:var(--c-accent)}
.tech-blocks>.b-specs span{font:600 10px/1 var(--mono);letter-spacing:.08em;color:var(--c-fg2)}
.tech-blocks>.b-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;background:transparent;border:0;padding:0}
.tech-blocks>.b-tiles .tile{background:#0d1420;border:1px solid var(--c-line);border-radius:7px;padding:16px}
.tech-blocks .tile .k{font:600 10px/1 var(--mono);letter-spacing:.1em;color:var(--c-accent2);margin-bottom:10px}
.tech-blocks .tile h4{font:700 16px/1.4 var(--sans);margin:0 0 8px}
.tech-blocks .tile p{font:13px/1.7 var(--sans);color:var(--c-fg2);margin:0}
.tech-blocks>.b-takeaway{border-left:3px solid var(--c-accent2)}
.take-k{font:600 11px/1 var(--mono);letter-spacing:.14em;color:var(--c-accent2);margin-bottom:10px}

/* ── 2 书页：正文左 + 竖排书脊右 ── */
body[data-theme="ink"]{
 --ff-head:var(--serif);--ff-body:var(--serif);
 --fs-hero:clamp(27px,3.8vw,39px);--fs-h2:20px;--fs-body:17px;--fs-meta:12px;
 --c-bg:#f2eee3;--c-panel:#faf7ee;--c-line:#d6ceba;--c-fg:#26221a;--c-fg2:#6a6252;--c-fg3:#9b9280;
 --c-accent:#9e2b2b;
 --bar:rgba(242,238,227,.93);--veil:rgba(244,240,229,.92)}
body[data-theme="ink"] .stage{max-width:980px;margin:0 auto;padding:48px 40px 90px}
.ink-page{display:grid;grid-template-columns:1fr 84px;gap:34px}
.ink-body .crumb{font:600 11px/1 var(--mono);letter-spacing:.14em;color:var(--c-accent);margin-bottom:20px}
.ink-body h1{font:400 var(--fs-hero)/1.42 var(--serif);letter-spacing:.01em;margin:0 0 22px}
.ink-body .dek{font:italic 16px/1.9 var(--serif);color:var(--c-fg2);margin:0 0 36px;padding-left:16px;border-left:2px solid var(--c-line)}
.ink-sechead{font:600 13px/1 var(--serif);letter-spacing:.18em;color:var(--c-accent);
  margin:40px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--c-line)}
.ink-blocks{display:flex;flex-direction:column;gap:20px}
.ink-blocks .b-sec{font:600 12px/1 var(--serif);letter-spacing:.18em;color:var(--c-accent);
  border-bottom:1px solid var(--c-line);padding-bottom:8px;margin-top:16px}
.ink-blocks .b-band{border-top:1px solid var(--c-line);border-bottom:1px solid var(--c-line);padding:18px 0}
.ink-blocks .b-band p{font:16px/2 var(--serif);text-indent:2em;margin:0 0 10px;color:var(--c-fg)}
.ink-blocks .b-band p:last-child{margin:0}
.ink-blocks .b-eq{font:400 22px/1.8 var(--serif);color:var(--c-accent);text-align:center;padding:20px 0;letter-spacing:.08em}
.ink-blocks .b-quote{font:400 23px/1.9 var(--serif);color:var(--c-accent);border-left:2px solid var(--c-line);padding-left:20px}
.ink-blocks .b-specs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 26px}
.ink-blocks .b-specs>div{display:flex;align-items:baseline;gap:10px;border-bottom:1px dotted var(--c-line);padding-bottom:8px}
.ink-blocks .b-specs b{font:400 27px/1 var(--serif);color:var(--c-accent)}
.ink-blocks .b-specs span{font:14px/1.6 var(--serif);color:var(--c-fg2)}
.ink-blocks .b-tiles{display:flex;flex-direction:column;gap:0}
.ink-blocks .tile{border:0;border-bottom:1px dotted var(--c-line);border-radius:0;background:transparent;padding:14px 0}
.ink-blocks .tile .k{font:600 11px/1 var(--mono);color:var(--c-fg3);margin-bottom:7px}
.ink-blocks .tile h4{font:500 18px/1.5 var(--serif);margin:0 0 5px}
.ink-blocks .tile p{font:15px/1.9 var(--serif);color:var(--c-fg2);margin:0;text-indent:0}
.ink-blocks .b-takeaway{border:0;border-top:1px solid var(--c-accent);border-radius:0;background:transparent;padding:18px 0 0;margin-top:16px}
.ink-blocks .b-takeaway .k{font:600 11px/1 var(--mono);letter-spacing:.14em;color:var(--c-accent)}
.ink-blocks .b-takeaway p{font:15px/1.95 var(--serif);color:var(--c-fg2);margin:10px 0 0;text-indent:0}
.ink-spine{border-left:1px solid var(--c-line);padding-left:20px;display:flex;flex-direction:column;align-items:center;gap:26px}
.ink-vtitle{writing-mode:vertical-rl;font:400 clamp(20px,2.4vw,28px)/1.3 var(--serif);letter-spacing:.22em;color:var(--c-fg);height:340px}
.ink-seal{width:42px;height:42px;border:2px solid var(--c-accent);color:var(--c-accent);
  display:flex;align-items:center;justify-content:center;font:600 13px/1.1 var(--serif);letter-spacing:.05em;text-align:center}

/* ── 3 杂志封面：色块 + 首字下沉 + 三栏 ── */
body[data-theme="mag"]{
 --ff-head:var(--sans);--ff-body:var(--sans);
 --fs-hero:clamp(40px,6.8vw,74px);--fs-h2:26px;--fs-body:16px;--fs-meta:12px;
 --c-bg:#ffffff;--c-panel:#f3f3f0;--c-line:#111111;--c-fg:#0d0d0d;--c-fg2:#4c4c47;--c-fg3:#8c8c84;
 --c-accent:#e02424;
 --bar:rgba(255,255,255,.95);--veil:rgba(255,255,255,.93)}
body[data-theme="mag"] .stage{max-width:1080px;margin:0 auto;padding:32px 28px 80px}
.mag-issue{display:flex;align-items:center;gap:14px;font:800 11px/1 var(--mono);letter-spacing:.18em;
  text-transform:uppercase;border-bottom:4px solid var(--c-fg);padding-bottom:12px;margin-bottom:20px}
.mag-issue .red{background:var(--c-accent);color:#fff;padding:5px 8px}
.mag-issue .right{margin-left:auto;color:var(--c-fg3)}
.mag-cover{position:relative;margin-bottom:26px}
.mag-slab{position:absolute;right:0;top:0;width:34%;height:100%;background:var(--c-accent);opacity:.1;z-index:-1}
.mag-cover h1{font:900 var(--fs-hero)/1.02 var(--sans);letter-spacing:-.06em;margin:0 0 18px;max-width:15em}
.mag-cover h1::first-letter{color:var(--c-accent)}
.mag-standfirst{font:700 19px/1.5 var(--sans);color:var(--c-fg);border-left:6px solid var(--c-accent);padding-left:16px;max-width:40em}
.mag-cols{column-count:3;column-gap:26px;column-rule:1px solid #d8d8d2}
.mag-cols>*{break-inside:avoid;margin:0 0 18px}
.mag-cols .b-sec,.mag-cols .b-quote,.mag-cols .b-eq,.mag-cols .b-specs,.mag-cols .b-table,
.mag-cols .b-timeline,.mag-cols .b-steps,.mag-cols .b-metrics,.mag-cols .b-vs,.mag-cols .b-nodes{column-span:all}
.mag-cols .b-sec{font:900 13px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--c-accent);border-top:3px solid var(--c-fg);padding-top:8px}
.mag-cols .b-band{background:transparent;padding:0}
.mag-cols .b-band p{font:16px/1.65 var(--sans);margin:0 0 12px;color:var(--c-fg2)}
.mag-cols .b-band p:first-child::first-letter{font:900 46px/.8 var(--sans);float:left;color:var(--c-fg);margin:6px 8px 0 0}
.mag-cols .b-eq{font:900 26px/1.4 var(--sans);color:var(--c-accent);text-align:center;border-top:3px solid var(--c-fg);padding-top:14px}
.mag-cols .b-quote{font:900 30px/1.3 var(--sans);color:var(--c-accent);border-top:5px solid var(--c-fg);padding-top:14px}
.mag-cols .b-specs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:3px solid var(--c-fg);border-bottom:4px solid var(--c-fg);padding:12px 0}
.mag-cols .b-specs>div{display:flex;flex-direction:column;gap:8px;padding:0 14px;border-right:1px solid #ddd}
.mag-cols .b-specs>div:last-child{border:0}
.mag-cols .b-specs b{font:900 32px/1 var(--sans);color:var(--c-accent)}
.mag-cols .b-specs span{font:800 11px/1.3 var(--mono);text-transform:uppercase;color:var(--c-fg2)}
.mag-cols .tile{border:2px solid var(--c-fg);border-radius:0;padding:14px}
.mag-cols .tile .k{font:800 10px/1 var(--mono);color:var(--c-accent)}
.mag-cols .tile h4{font:800 16px/1.3 var(--sans);margin:8px 0 6px}
.mag-cols .tile p{font:14px/1.6 var(--sans);color:var(--c-fg2);margin:0}
.mag-cols .b-takeaway{background:var(--c-fg);color:#fff;padding:18px;column-span:all}
.mag-cols .b-takeaway .k{font:800 11px/1 var(--mono);letter-spacing:.14em;color:#ff6b6b}
.mag-cols .b-takeaway p{font:15px/1.6 var(--sans);color:#fff;margin:10px 0 0}
.mag-cols .b-takeaway b{color:#fff}

/* ── 4 留白卷：窄栏 + 大间距 + 细线 ── */
body[data-theme="zen"]{
 --ff-head:var(--serif);--ff-body:var(--serif);
 --fs-hero:clamp(26px,3.6vw,36px);--fs-h2:19px;--fs-body:16px;--fs-meta:11px;
 --c-bg:#f7f6f1;--c-panel:transparent;--c-line:#dfdcd3;--c-fg:#302e28;--c-fg2:#827d72;--c-fg3:#aaa59a;
 --c-accent:#8f6238;
 --bar:rgba(247,246,241,.95);--veil:rgba(248,247,242,.94)}
body[data-theme="zen"] .stage{max-width:640px;margin:0 auto;padding:60px 26px 100px;text-align:center}
.zen-mark{color:var(--c-accent);font-size:13px;letter-spacing:.6em;margin:0 0 34px}
.zen-crumb{font:400 11px/1 var(--serif);letter-spacing:.28em;color:var(--c-accent);margin:0 0 40px}
.zen-title{font:300 var(--fs-hero)/1.55 var(--serif);letter-spacing:.06em;margin:0 auto 40px;max-width:14em}
.zen-rule{width:36px;height:1px;background:var(--c-accent);margin:0 auto 40px}
.zen-dek{font:400 15px/2.1 var(--serif);color:var(--c-fg2);max-width:24em;margin:0 auto 20px}
.zen-blocks{display:flex;flex-direction:column;gap:76px;margin-top:70px;text-align:left}
.zen-blocks>*{position:relative}
.zen-blocks .b-sec{font:400 12px/1 var(--serif);letter-spacing:.3em;color:var(--c-accent);text-align:center;
  padding-bottom:18px;border-bottom:1px solid var(--c-line)}
.zen-blocks .b-band{border:0;padding:0;background:transparent}
.zen-blocks .b-band p{font:16px/2.15 var(--serif);color:var(--c-fg);margin:0 0 18px;text-align:center}
.zen-blocks .b-eq{font:300 22px/1.9 var(--serif);color:var(--c-accent);text-align:center;letter-spacing:.1em}
.zen-blocks .b-quote{font:300 26px/2 var(--serif);color:var(--c-accent);text-align:center;
  border-top:1px solid var(--c-line);border-bottom:1px solid var(--c-line);padding:30px 0}
.zen-blocks .b-specs{display:grid;grid-template-columns:1fr 1fr;gap:26px 30px}
.zen-blocks .b-specs>div{display:flex;flex-direction:column;gap:8px;align-items:center}
.zen-blocks .b-specs b{font:300 30px/1 var(--serif);color:var(--c-accent)}
.zen-blocks .b-specs span{font:14px/1.7 var(--serif);color:var(--c-fg2)}
.zen-blocks .b-tiles{display:flex;flex-direction:column;gap:30px}
.zen-blocks .tile{border:0;border-top:1px solid var(--c-line);border-radius:0;background:transparent;padding:20px 0 0;text-align:center}
.zen-blocks .tile .k{font:400 11px/1 var(--serif);letter-spacing:.2em;color:var(--c-fg3);margin-bottom:10px}
.zen-blocks .tile h4{font:400 19px/1.6 var(--serif);margin:0 0 8px}
.zen-blocks .tile p{font:15px/2 var(--serif);color:var(--c-fg2);margin:0}
.zen-blocks .b-takeaway{border:0;border-top:1px solid var(--c-line);border-radius:0;background:transparent;padding:22px 0 0;text-align:center}
.zen-blocks .b-takeaway .k{font:400 11px/1 var(--serif);letter-spacing:.2em;color:var(--c-accent)}
.zen-blocks .b-takeaway p{font:15px/2.05 var(--serif);color:var(--c-fg2);margin:14px 0 0}
.zen-end{margin-top:80px;color:var(--c-fg3);letter-spacing:.6em;font-size:12px}

/* ── 通用块：按主题变量收敛 ── */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:12px 13px;border-bottom:1px solid var(--c-line)}
th{font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--c-fg3)}
td:first-child{color:var(--c-fg2)}
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--c-line)}
.tl .ev{position:relative;padding:0 0 22px 14px}
.tl .ev::before{content:"";position:absolute;left:-26px;top:6px;width:9px;height:9px;border-radius:50%;
  background:var(--c-bg);border:2px solid var(--c-accent)}
.tl .ev.hot::before{background:var(--c-accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--c-accent) 20%,transparent)}
.tl .date{font:600 12px/1 var(--mono);color:var(--c-accent);margin-bottom:6px}
.tl h4{margin:0 0 5px;font-size:16px}
.tl p{margin:0;font-size:14px;color:var(--c-fg2)}
.steps{display:grid;gap:10px}
.step{display:flex;gap:16px;padding:15px;border:1px dashed var(--c-accent);border-radius:9px}
.step .n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--c-accent);
  display:flex;align-items:center;justify-content:center;font:700 14px/1 var(--mono);color:var(--c-accent)}
.step h4{margin:0 0 4px;font-size:15px}
.step p{margin:0;font-size:13px;color:var(--c-fg2)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.metric{padding:18px;border:1px solid var(--c-line);border-radius:9px}
.metric .lab{font:600 11px/1 var(--mono);color:var(--c-fg2);margin-bottom:10px}
.metric .num{font:750 34px/1 var(--mono);color:var(--c-accent);margin-bottom:12px}
.metric .bar{height:5px;background:var(--c-line);border-radius:5px;overflow:hidden}
.metric .bar i{display:block;height:100%;background:var(--c-accent)}
.metric .sub{margin-top:9px;font-size:12px;color:var(--c-fg3)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs .col{padding:18px;border:1px solid var(--c-line);border-radius:9px}
.vs .col.win{border-color:var(--c-accent)}
.vs .col h4{margin:0 0 12px;font-size:16px}
.vs .col ul{margin:0;padding:0;list-style:none}
.vs .col li{padding:8px 0;border-bottom:1px solid var(--c-line);font-size:13px;color:var(--c-fg2)}
.vs .col li:last-child{border:0}
.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;align-items:start}
.node{padding:18px;border:1px solid var(--c-accent);border-radius:9px}

.node h4{margin:0 0 7px;font-size:16px}
.node p{margin:0;font-size:13px;color:var(--c-fg2)}
.arrowline{grid-column:1/-1;text-align:center;color:var(--c-fg3);font:600 12px/1 var(--mono);letter-spacing:.2em}

}

var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var N=(window.innerWidth<640||reduced)?600:1300;
var canvas=document.getElementById('gl');
var renderer,scene,camera,group,geo,clock;
var base=new Float32Array(N*3),seed=new Float32Array(N),seed2=new Float32Array(N);
var theme='tech',type='product',pointer={x:0,y:0},rot={x:0,y:0};
function rand(i,k){var x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);}
for(var i=0;i<N;i++){seed[i]=rand(i,1);seed2[i]=rand(i,2);}
function dotTex(){var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d'),
 gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');
 gr.addColorStop(.35,'rgba(255,255,255,.8)');gr.addColorStop(1,'rgba(255,255,255,0)');
 g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
function init(){
 try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:false});}catch(e){canvas.style.display='none';return;}
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
 scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(50,1,.1,100);camera.position.z=22;
 group=new THREE.Group();scene.add(group);
 var pos=new Float32Array(N*3),col=new Float32Array(N*3);
 geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
 geo.setAttribute('color',new THREE.BufferAttribute(col,3));
 group.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.15,map:dotTex(),vertexColors:true,
  transparent:true,opacity:.8,depthWrite:false,blending:THREE.AdditiveBlending})));
 clock=new THREE.Clock();applyScene();window.addEventListener('resize',resize);resize();requestAnimationFrame(frame);
}
function applyScene(){
 if(!renderer)return;
 var col=geo.attributes.color.array,c=new THREE.Color(),hexMap={tech:[0x00b4ff,0x37506a],ink:[0x9e2b2b,0x9a8f7a],
  mag:[0xe02424,0x111111],zen:[0x8f6238,0xb8b2a4]};
 for(var i=0;i<N;i++){
  var s=seed[i],s2=seed2[i],x=(s-.5)*22,y=(s2-.5)*14;
  base[i*3]=x;base[i*3+1]=y;base[i*3+2]=(s-.5)*5;
  c.setHex(i%7===0?hexMap[theme][0]:hexMap[theme][1]);
  col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
 }
 geo.attributes.color.needsUpdate=true;
 renderer.setClearColor({tech:0x090d14,ink:0xf2eee3,mag:0xffffff,zen:0xf7f6f1}[theme],1);
}
function frame(){
 if(!renderer)return;requestAnimationFrame(frame);
 var t=clock.getElapsedTime(),pos=geo.attributes.position.array;
 for(var i=0;i<N;i++){
  var s=seed[i],s2=seed2[i];
  pos[i*3]=base[i*3]+Math.sin(t*.35+s*6)*.28;
  pos[i*3+1]=base[i*3+1]+Math.cos(t*.3+s2*6)*.24;
  pos[i*3+2]=base[i*3+2];
 }
 geo.attributes.position.needsUpdate=true;
 rot.y+=(pointer.x*.16-rot.y)*.04;rot.x+=(-pointer.y*.1-rot.x)*.04;
 group.rotation.y=rot.y;group.rotation.x=rot.x;
 renderer.render(scene,camera);
}
function resize(){if(!renderer)return;var w=window.innerWidth,h=window.innerHeight;
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('pointermove',function(e){pointer.x=(e.clientX/window.innerWidth)*2-1;
 pointer.y=(e.clientY/window.innerHeight)*2-1;},{passive:true});

function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function rich(c,s){
 var re=/<b>([\s\S]*?)<\/b>|<br\s*\/?>/g,m,pos=0;
 while((m=re.exec(s))){if(m.index>pos)c.appendChild(document.createTextNode(s.slice(pos,m.index)));
  if(m[1]!=null)c.appendChild(el('b','',m[1]));else c.appendChild(document.createElement('br'));pos=re.lastIndex;}
 if(pos<s.length)c.appendChild(document.createTextNode(s.slice(pos)));
}
function blockDOM(b,pfx){
 var wrap=el('div',pfx+'-'+b.t+' b-'+b.t);
 if(b.t==='sec'){wrap.textContent=b.v;}
 else if(b.t==='band'){b.v.forEach(function(p){var q=el('p');rich(q,p);wrap.appendChild(q);});}
 else if(b.t==='eq'){rich(wrap,b.v);}
 else if(b.t==='specs'){b.v.forEach(function(v){var c=el('div');c.appendChild(el('b','',v[0]));c.appendChild(el('span','',v[1]));wrap.appendChild(c);});}
 else if(b.t==='tiles'){b.v.forEach(function(v){var t=el('div','tile');t.appendChild(el('div','k',v[0]));
  t.appendChild(el('h4','',v[1]));t.appendChild(el('p','',v[2]));wrap.appendChild(t);});}
 else if(b.t==='timeline'){wrap=el('div',pfx+'-tl tl b-timeline');b.v.forEach(function(v){var ev=el('div','ev'+(v[3]?' hot':''));
  ev.appendChild(el('div','date',v[0]));ev.appendChild(el('h4','',v[1]));ev.appendChild(el('p','',v[2]));wrap.appendChild(ev);});}
 else if(b.t==='table'){wrap=el('table','b-table');var hr=el('tr');b.head.forEach(function(h){hr.appendChild(el('th','',h));});wrap.appendChild(hr);
  b.rows.forEach(function(r){var tr=el('tr');r.forEach(function(v){tr.appendChild(el('td','',v));});wrap.appendChild(tr);});}
 else if(b.t==='vs'){b.v.forEach(function(v){var c=el('div','col'+(v[2]?' win':''));c.appendChild(el('h4','',v[0]));
  var ul=el('ul');v[1].forEach(function(li){ul.appendChild(el('li','',li));});c.appendChild(ul);wrap.appendChild(c);});}
 else if(b.t==='steps'){wrap=el('div',pfx+'-steps steps b-steps');b.v.forEach(function(v,i){var s=el('div','step');
  s.appendChild(el('div','n',String(i+1)));var w=el('div');w.appendChild(el('h4','',v[0]));w.appendChild(el('p','',v[1]));
  s.appendChild(w);wrap.appendChild(s);});}
 else if(b.t==='metrics'){wrap=el('div',pfx+'-metrics metrics b-metrics');b.v.forEach(function(v){var m=el('div','metric');
  m.appendChild(el('div','lab',v[0]));m.appendChild(el('div','num',v[1]));var bar=el('div','bar'),fill=el('i');
  fill.style.width=v[2]+'%';bar.appendChild(fill);m.appendChild(bar);m.appendChild(el('div','sub',v[3]));wrap.appendChild(m);});}
 else if(b.t==='quote'){rich(wrap,b.v);}
 else if(b.t==='nodes'){wrap=el('div',pfx+'-nodes nodes b-nodes');b.v.forEach(function(v){
  if(v[1]===null){wrap.appendChild(el('div','arrowline',v[0]));}else{var n=el('div','node');
  n.appendChild(el('div','role',v[0]));n.appendChild(el('h4','',v[1]));n.appendChild(el('p','',v[2]));wrap.appendChild(n);}});}
 else if(b.t==='takeaway'){wrap.appendChild(el('div','take-k',b.k));var p=el('p');rich(p,b.v);wrap.appendChild(p);}
 return wrap;
}
function addBlocks(parent,d,pfx){d.blocks.forEach(function(b){parent.appendChild(blockDOM(b,pfx));});}

function renderStage(){var d=TYPES.filter(function(x){return x.id===type;})[0],stage=document.getElementById('stage');
 stage.textContent='';LAYOUT[theme](d,stage);}

function buildTabs(){
 var tt=document.getElementById('themeTabs'),yt=document.getElementById('typeTabs');
 THEMES.filter(function(x){return x.id==='zen';}).forEach(function(t){var b=el('button','',t.n);b.dataset.id=t.id;tt.appendChild(b);});
 TYPES.forEach(function(t){var b=el('button','',t.n);b.dataset.id=t.id;b.addEventListener('click',function(){setType(t.id);});yt.appendChild(b);});
}
function mark(cont,id){var bs=cont.querySelectorAll('button');for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-current',bs[i].dataset.id===id?'true':'false');}
function setTheme(id){theme=id;document.body.setAttribute('data-theme',id);
 var t=THEMES.filter(function(x){return x.id===id;})[0];
 document.getElementById('themeNote').textContent=t.note;
 document.documentElement.style.setProperty('--accent',t.c);
 mark(document.getElementById('themeTabs'),id);renderStage();applyScene();}
function setType(id){type=id;mark(document.getElementById('typeTabs'),id);renderStage();window.scrollTo(0,0);}
buildTabs();setTheme('zen');setType('product');init();
})();
</script>
</body>
</html>
