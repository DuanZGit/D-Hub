<!DOCTYPE html>
<!--
  show-me 交互情景库 · 13 组可玩可演的场景  interactive-scenes.html
  ────────────────────────────────────────────────
  和 motion-16.html 的分工：
    motion-16        = 背景动效，打开就自己动，不需要人参与
    interactive-scenes = 可操作、可演示、有情景，人不动它就不往下走

  四类场景：
    A 直接操作（引力场 / 流场画笔 / 点击涟漪 / 参数实验台）
    B 情景模拟（数据流转 / 路口信号 / 雷达扫描 / 传播扩散）
    C 动画叙事（流程链 / 形态演变 / 时间回放）
    D 空间距离（景深视差 / 隧道穿梭）

  结构：顶部 12 个入口（按类分组）→ 左侧实时预览 + HUD 提示 + 参数控件 → 右侧说明 + 可复制核心代码。

  改：
    1. 挑一个场景：复制它的 S[id] 对象（init/update/pointer/param 四件套）到你自己的页面
    2. 换情景：改 init 里造的节点/路径/颜色，改 update 里的规则
    3. 换交互：改 pointer(type,x,y) 里对 down/move/up 的响应
    4. HUD 提示写在 hint 字段，参数控件写在 params 字段
  硬约束：单文件、内联 Three.js 无外链、禁 innerHTML、鼠标+触摸双通道、prefers-reduced-motion 兜底。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>show-me · 13 组交互情景</title>
<style>
:root{--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 --bg:#080c12;--panel:#101822;--line:#223040;--fg:#e8eef6;--fg2:#96a3b6;--fg3:#5d6b7d;
 --c1:#7ad7ff;--c2:#ff8a5b;--c3:#8ce99a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.7 var(--sans);touch-action:none}
header{padding:20px 28px 14px;border-bottom:1px solid var(--line);max-width:1400px;margin:0 auto}
header h1{font:750 clamp(22px,3vw,30px)/1.2 var(--sans);letter-spacing:-.02em;margin:0 0 6px}
header p{margin:0;color:var(--fg2);font-size:13px}
.catrow{max-width:1400px;margin:14px auto 0;padding:0 28px;display:flex;gap:18px;flex-wrap:wrap}
.catrow span{font:600 11px/1 var(--mono);letter-spacing:.1em;color:var(--fg3)}
.catrow span b{color:var(--c1);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:1400px;margin:12px auto;padding:0 28px}
.grid button{cursor:pointer;background:var(--panel);border:1px solid var(--line);color:var(--fg2);
 border-radius:8px;padding:10px;text-align:left;font:600 12px/1.4 var(--sans);transition:border-color .18s,color .18s}
.grid button small{display:block;font:600 10px/1 var(--mono);color:var(--fg3);margin-bottom:5px;letter-spacing:.08em}
.grid button[aria-current="true"]{border-color:var(--c1);color:var(--c1)}
.grid button[aria-current="true"] small{color:var(--c2)}
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px;max-width:1400px;margin:0 auto;padding:0 28px 60px}
.stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#05080d;aspect-ratio:16/10}
.stage canvas{width:100%;height:100%;display:block;cursor:crosshair}
.badge{position:absolute;left:16px;top:14px;font:600 11px/1 var(--mono);letter-spacing:.12em;
 color:var(--c1);background:rgba(8,12,18,.7);padding:8px 10px;border-radius:6px;border:1px solid var(--line)}
.hint{position:absolute;left:16px;bottom:14px;font:600 11px/1.5 var(--mono);color:var(--c2);
 background:rgba(8,12,18,.7);padding:8px 10px;border-radius:6px;border:1px solid var(--line);pointer-events:none}
.params{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.params label{font:600 10px/1 var(--mono);color:var(--fg2);display:flex;align-items:center;gap:8px;
 background:rgba(8,12,18,.72);padding:7px 9px;border-radius:6px;border:1px solid var(--line)}
.params input[type=range]{width:90px;accent-color:var(--c1)}
.track{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(8,12,18,.6);display:none}
.track input{width:100%;accent-color:var(--c1)}
.info{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:22px;display:flex;flex-direction:column;min-height:0}
.info h2{font:750 24px/1.3 var(--sans);margin:0 0 6px}
.info .en{font:600 11px/1 var(--mono);letter-spacing:.14em;color:var(--c2);margin-bottom:18px}
.info .desc{color:var(--fg2);font-size:14px;margin:0 0 22px}
.info .lab{font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--fg3);margin-bottom:10px}
pre{flex:1;min-height:150px;max-height:330px;overflow:auto;margin:0 0 16px;padding:16px;
 background:#070b11;border:1px solid var(--line);border-radius:8px;color:#b9d9e8;
 font:12px/1.7 var(--mono);white-space:pre-wrap;word-break:break-all}
.copy{cursor:pointer;align-self:flex-start;border:1px solid var(--c1);color:var(--c1);background:transparent;
 border-radius:7px;padding:9px 16px;font:600 12px/1 var(--sans)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}.main{grid-template-columns:1fr}}
@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}.main{padding:0 14px 40px}.grid{padding:0 14px}.catrow{padding:0 14px}}
</style>
</head>
<body>
<header><h1>13 组交互情景</h1><p>不只看，还能玩、能演、能拖 · 鼠标和触屏都能操作</p></header>
<div class="catrow"><span><b>A</b> 直接操作</span><span><b>B</b> 情景模拟</span><span><b>C</b> 动画叙事</span><span><b>D</b> 空间距离</span></div>
<div class="grid" id="grid"></div>
<div class="main">
 <div class="stage" id="stageEl"><canvas id="gl"></canvas><div class="badge" id="badge"></div>
  <div class="hint" id="hint"></div><div class="params" id="params"></div>
  <div class="track" id="track"><input type="range" id="scrub" min="0" max="1000" value="0"></div></div>
 <div class="info"><h2 id="ttl"></h2><div class="en" id="en"></div><p class="desc" id="desc"></p>
  <div class="lab">核心代码 / COPY</div><pre id="code"></pre><button class="copy" id="copy">复制代码</button></div>
</div>
<script src="assets/three.min.js"></script>
<script>
(function(){
"use strict";
var C1=0x7ad7ff,C2=0xff8a5b,C3=0x8ce99a,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var canvas=document.getElementById('gl'),renderer,clock,cleanup=null,cur='gravity';
var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(52,1,.1,400),group=new THREE.Group();
camera.position.z=26;scene.add(group);
try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});}catch(e){canvas.style.display='none';}
if(renderer){renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));clock=new THREE.Clock();
 renderer.setClearColor(0x05080d,1);
 new ResizeObserver(function(){var w=canvas.clientWidth,h=canvas.clientHeight;
  if(w&&h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}).observe(canvas);
}
var P={x:0,y:0,down:false,wx:0,wy:0};
function toWorld(e){var r=canvas.getBoundingClientRect();
 var nx=(e.clientX-r.left)/r.width*2-1,ny=-((e.clientY-r.top)/r.height*2-1);
 var v=new THREE.Vector3(nx,ny,.5).unproject(camera),dir=v.sub(camera.position).normalize();
 var d=-camera.position.z/dir.z;P.wx=camera.position.x+dir.x*d;P.wy=camera.position.y+dir.y*d;}
canvas.addEventListener('pointerdown',function(e){P.down=true;toWorld(e);if(S[cur]&&S[cur].pointer)S[cur].pointer('down',P.wx,P.wy);});
canvas.addEventListener('pointermove',function(e){toWorld(e);if(S[cur]&&S[cur].pointer)S[cur].pointer(P.down?'drag':'move',P.wx,P.wy);});
window.addEventListener('pointerup',function(){P.down=false;if(S[cur]&&S[cur].pointer)S[cur].pointer('up',P.wx,P.wy);});
function pts(n,color,size){var p=new Float32Array(n*3),g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(p,3));
 var o=new THREE.Points(g,new THREE.PointsMaterial({color:color,size:size||.16,transparent:true,opacity:.85,
  depthWrite:false,blending:THREE.AdditiveBlending}));return {o:o,p:p,g:g};}
function lines(n,color,opacity){var p=new Float32Array(n*2*3),g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(p,3));
 var o=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:color,transparent:true,
  opacity:opacity||.3,blending:THREE.AdditiveBlending,depthWrite:false}));return {o:o,p:p,g:g};}
function ball(x,y,z,r,color){var m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),
 new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:.9}));m.position.set(x,y,z);return m;}
function rnd(i,k){var x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);}
function clear(){while(group.children.length){var o=group.children[0];group.remove(o);
  o.traverse(function(c){if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();});}
 cleanup=null;document.getElementById('params').textContent='';document.getElementById('track').style.display='none';}
function addSlider(name,min,max,val,fn){var box=document.getElementById('params'),l=document.createElement('label');
 l.appendChild(document.createTextNode(name));var i=document.createElement('input');i.type='range';
 i.min=min;i.max=max;i.value=val;i.addEventListener('input',function(){fn(+i.value);});l.appendChild(i);box.appendChild(l);}
var S={};
/* A1 引力场 */
S.gravity={cat:'A',n:'引力场',en:'GRAVITY FIELD',hint:'按住拖动 = 吸引粒子 · 松开 = 粒子飞散',
d:'指针变成一个引力源，粒子被拽过去又挣脱。用来讲「影响力」「中心与外围」。',
c:'// 每帧计算指针到粒子的引力\nvar dx = px - p[i*3], dy = py - p[i*3+1];\nvar d2 = dx*dx + dy*dy + 2;\nvar f = strength / d2;\nv[i*3]   += dx * f * .01;\nv[i*3+1] += dy * f * .01;\nv[i*3]   *= .96;  // 阻尼\np[i*3]   += v[i*3];',
b:function(){var A=pts(1100,C1,.16),v=new Float32Array(3300),bx=new Float32Array(1100),by=new Float32Array(1100);
 for(var i=0;i<1100;i++){bx[i]=(rnd(i,1)-.5)*30;by[i]=(rnd(i,2)-.5)*19;A.p[i*3]=bx[i];A.p[i*3+1]=by[i];}
 group.add(A.o);var strength=60;addSlider('引力',10,140,60,function(x){strength=x;});
 cleanup=function(t){for(var i=0;i<1100;i++){
  var dx=P.wx-A.p[i*3],dy=P.wy-A.p[i*3+1],d2=dx*dx+dy*dy+3,f=P.down?strength/d2:0;
  v[i*3]=(v[i*3]+dx*f*.02)*.95;v[i*3+1]=(v[i*3+1]+dy*f*.02)*.95;
  var bxv=bx[i]-A.p[i*3],byv=by[i]-A.p[i*3+1];
  v[i*3]+=bxv*.002;v[i*3+1]+=byv*.002;
  A.p[i*3]+=v[i*3];A.p[i*3+1]+=v[i*3+1];}
  A.g.attributes.position.needsUpdate=true;};}};
/* A2 流场画笔 */
S.brush={cat:'A',n:'流场画笔',en:'FLOW BRUSH',hint:'按住拖动 = 画出流场，粒子跟着轨迹走',
d:'手指划过的地方留下力场，粒子顺着痕迹流动并慢慢淡去。适合讲「引导」「路径依赖」。',
c:'// 记录最近 N 个指针位置作为力场\ntrail.push({x:px, y:py, life:1});\nfor (var k=0;k<trail.length;k++){\n  var d = 距离(trail[k], 粒子);\n  if (d < 4) v += 方向 * trail[k].life * .02;\n  trail[k].life *= .985;  // 痕迹衰减\n}',
b:function(){var A=pts(1400,C1,.13),v=new Float32Array(4200),trail=[];
 for(var i=0;i<1400;i++){A.p[i*3]=(rnd(i,1)-.5)*32;A.p[i*3+1]=(rnd(i,2)-.5)*20;}
 group.add(A.o);cleanup=function(t){
  if(P.down&&P.wx!==undefined)trail.push({x:P.wx,y:P.wy,life:1});
  if(trail.length>70)trail.shift();
  for(var i=0;i<1400;i++){var vx=0,vy=0;
   for(var k=0;k<trail.length;k++){var dx=trail[k].x-A.p[i*3],dy=trail[k].y-A.p[i*3+1];
    var d2=dx*dx+dy*dy;if(d2<20){var f=trail[k].life/(d2+1);vx+=dx*f;vy+=dy*f;}}
   v[i*3]=(v[i*3]+vx*.04)*.94;v[i*3+1]=(v[i*3+1]+vy*.04)*.94;
   A.p[i*3]+=v[i*3];A.p[i*3+1]+=v[i*3+1];
   if(Math.abs(A.p[i*3])>17)A.p[i*3]*=-.98;if(Math.abs(A.p[i*3+1])>11)A.p[i*3+1]*=-.98;}
  for(var k=0;k<trail.length;k++)trail[k].life*=.985;
  A.g.attributes.position.needsUpdate=true;};}};
/* A3 点击涟漪 */
S.ripple={cat:'A',n:'点击涟漪',en:'CLICK RIPPLE',hint:'点一下画布 = 从该点扩散一圈波',
d:'每次点击生成一圈扩散波，粒子被波推着走。适合讲「触发」「一次动作的影响」。',
c:'// 点击时记录波源\nwaves.push({x:px, y:py, t:0});\n// 每帧：波半径随时间增长，粒子在波前附近被推开\nfor (var w of waves){\n  var r = w.t * 8;\n  var d = 距离(粒子, w);\n  if (Math.abs(d - r) < 1.5){\n    p += 方向 * .3;\n  }\n  w.t += .016;\n}',
b:function(){var A=pts(1300,C1,.15),waves=[];
 for(var i=0;i<1300;i++){A.p[i*3]=(rnd(i,1)-.5)*34;A.p[i*3+1]=(rnd(i,2)-.5)*21;}
 group.add(A.o);S.ripple.pointer=function(type,x,y){if(type==='down')waves.push({x:x,y:y,t:0});};
 cleanup=function(t){for(var i=0;i<1300;i++){
  for(var k=0;k<waves.length;k++){var w=waves[k],dx=A.p[i*3]-w.x,dy=A.p[i*3+1]-w.y,
   d=Math.sqrt(dx*dx+dy*dy),r=w.t*9;
   if(Math.abs(d-r)<1.4){A.p[i*3]+=dx/(d+1)*.35;A.p[i*3+1]+=dy/(d+1)*.35;}}
  A.p[i*3]+=Math.sin(t*.3+i)*.004;A.p[i*3+1]+=Math.cos(t*.25+i)*.004;}
  for(var k=waves.length-1;k>=0;k--){waves[k].t+=.016;if(waves[k].t>3)waves.splice(k,1);}
  A.g.attributes.position.needsUpdate=true;};}};
/* A4 参数实验台 */
S.params={cat:'A',n:'参数实验台',en:'PARAM LAB',hint:'拖右侧滑杆 = 密度 / 速度 / 扭曲度实时变',
d:'三个滑杆直接控制粒子的形态。适合讲「调参」「变量如何影响结果」。',
c:'// 滑杆绑定到变量，update 里直接读\nvar count = density;   // 粒子数\nvar speed = velocity;  // 旋转速度\nvar warp  = twist;     // 扭曲幅度\nfor (var i=0;i<N;i++){\n  var a = base[i].a + t*speed;\n  p[i*3] = Math.cos(a)*r + Math.sin(t+i)*warp;\n  p[i*3+1] = base[i].y;\n}',
b:function(){var A=pts(1200,C1,.16),an=new Float32Array(1200),rr=new Float32Array(1200),yy=new Float32Array(1200);
 for(var i=0;i<1200;i++){an[i]=rnd(i,1)*6.283;rr[i]=1+rnd(i,2)*10;yy[i]=(rnd(i,3)-.5)*13;}
 group.add(A.o);var speed=.5,warp=.5;
 addSlider('速度',0,2,.5,function(x){speed=x;});addSlider('扭曲',0,3,.5,function(x){warp=x;});
 cleanup=function(t){for(var i=0;i<1200;i++){
  var a=an[i]+t*speed;A.p[i*3]=Math.cos(a)*rr[i]+Math.sin(t*2+i)*warp;
  A.p[i*3+1]=yy[i]+Math.sin(a*2)*warp*.5;A.p[i*3+2]=Math.sin(a)*rr[i];}
  A.g.attributes.position.needsUpdate=true;};}};
/* B1 数据流转 */
S.packets={cat:'B',n:'数据流转',en:'PACKET FLOW',hint:'点亮节点 = 看它的状态 · 数据沿链路跑',
d:'七个节点组成一条链，数据包在上面跑。点节点看读数。适合讲「流程」「链路」「系统状态」。',
c:'// 节点坐标 + 链路\nvar nodes = [[x,y],...];\n// 数据包在链路上移动\nfor (var k=0;k<packets.length;k++){\n  packets[k].u += .004;\n  if (packets[k].u > 1) packets[k].u = 0;\n  var seg = 路径取点(packets[k].u);\n  p[k*3] = seg.x; p[k*3+1] = seg.y;\n}',
b:function(){var N=[[-13,0],[-8,4],[-3,-3],[2,2],[7,-2],[12,3],[15,-1]];
 N.forEach(function(n,i){group.add(ball(n[0],n[1],0,.35,i===3?C2:C1));});
 var L=lines(6,C1,.4);for(var i=0;i<6;i++){L.p[i*6]=N[i][0];L.p[i*6+1]=N[i][1];
  L.p[i*6+3]=N[i+1][0];L.p[i*6+4]=N[i+1][1];}L.g.attributes.position.needsUpdate=true;group.add(L.o);
 var A=pts(24,C2,.45);group.add(A.o);
 cleanup=function(t){for(var k=0;k<24;k++){var u=(k/24+t*.12)%1,seg=u*6,i=Math.floor(seg),f=seg-i;
  A.p[k*3]=N[i][0]+(N[i+1][0]-N[i][0])*f;A.p[k*3+1]=N[i][1]+(N[i+1][1]-N[i][1])*f;}
  A.g.attributes.position.needsUpdate=true;};}};
/* B2 路口信号 */
S.traffic={cat:'B',n:'路口信号',en:'TRAFFIC SIGNAL',hint:'看灯变色 = 车流停下和放行，自动循环',
d:'十字路口，红灯停绿灯行，车会排队。适合讲「规则」「调度」「等待与放行」。',
c:'// 信号状态机\nvar green = Math.floor(t/4) % 2;  // 0: 横向通行 1: 纵向通行\n// 车辆按信号更新位置\nfor (var car of cars){\n  if (car.axis === green) car.x += speed;\n  else if (接近路口) car.x = 停止线;\n}',
b:function(){var cars=[];for(var i=0;i<18;i++)cars.push({axis:i%2,x:-16+(i%9)*3.5,v:.6+rnd(i,1)*.5});
 var A=pts(18,C1,.5);group.add(A.o);
 var L=lines(4,C3,.5);L.p[0]=-16;L.p[1]=0;L.p[3]=16;L.p[4]=0;L.p[6]=0;L.p[7]=-10;L.p[9]=0;L.p[10]=10;
 L.g.attributes.position.needsUpdate=true;group.add(L.o);
 var lamp=ball(0,0,1,.5,C3);group.add(lamp);
 cleanup=function(t){var green=Math.floor(t/4)%2;lamp.material.color.setHex(green?C1:C2);
  for(var i=0;i<18;i++){var c=cars[i];if(c.axis===green){c.x+=c.v;}else if(Math.abs(c.x)<2&&Math.abs(c.x)>0)c.x=Math.sign(c.x)*2;
   if(c.x>16)c.x=-16;
   A.p[i*3]=c.axis===green?c.x:0;A.p[i*3+1]=c.axis===green?0:c.x*.6;}
  A.g.attributes.position.needsUpdate=true;};}};
/* B3 雷达扫描 */
S.scan={cat:'B',n:'雷达扫描',en:'RADAR SCAN',hint:'扫描线转一圈 = 扫到目标就亮起，目标会淡出',
d:'一道扇形扫过，命中目标就亮一下再慢慢暗掉。适合讲「监测」「发现」「巡检」。',
c:'var sweep = t * 1.1 % (Math.PI*2);\nfor (var target of targets){\n  var d = 角度差(target.angle, sweep);\n  if (d < .2) target.alpha = 1;   // 扫到\n  target.alpha *= .985;           // 慢慢淡出\n}',
b:function(){var A=pts(700,C1,.09),rr=new Float32Array(700),aa=new Float32Array(700);
 for(var i=0;i<700;i++){rr[i]=1+rnd(i,1)*13;aa[i]=rnd(i,2)*6.283;}
 group.add(A.o);var T=[];for(var i=0;i<9;i++)T.push({a:rnd(i,4)*6.283,r:2+rnd(i,5)*10,alpha:0});
 var B=pts(9,C2,.8);group.add(B.o);
 cleanup=function(t){var sw=t*1.1%(6.283),k=0;for(var i=0;i<700;i++){
  var d=Math.abs(((aa[i]-sw+9.42)%6.283)-3.14159);A.p[i*3]=Math.cos(aa[i])*rr[i];
  A.p[i*3+1]=Math.sin(aa[i])*rr[i];A.p[i*3+2]=d < .18 ? .5 : 0;k++;}
  for(var i=0;i<9;i++){var d=Math.abs(((T[i].a-sw+9.42)%6.283)-3.14159);if(d<.22)T[i].alpha=1;

  A.g.attributes.position.needsUpdate=true;B.g.attributes.position.needsUpdate=true;};}};
/* B4 传播扩散 */
S.spread={cat:'B',n:'传播扩散',en:'SPREAD',hint:'点节点 = 手动感染它，看扩散怎么走',
d:'从一个点开始，沿着连接一条条传下去。适合讲「传播」「级联影响」「病毒式扩散」。',
c:'// 邻接表 + 状态\nvar state = [0,0,1,0,...];  // 1 = 已感染\n// 每帧：已感染的把邻居也感染\nfor (var i=0;i<N;i++){\n  if (state[i]) for (var j of adj[i])\n    if (Math.random() < .01) state[j] = 1;\n}',
b:function(){var N=[];for(var i=0;i<22;i++){var a=i/22*6.283,r=3+rnd(i,1)*9;
  N.push([Math.cos(a)*r,Math.sin(a)*r*.7]);}
 var st=new Array(22).fill(0);st[0]=1;
 var L=lines(22,C1,.22);for(var i=0;i<22;i++){L.p[i*6]=N[i][0];L.p[i*6+1]=N[i][1];
  var j=(i+1)%22;L.p[i*6+3]=N[j][0];L.p[i*6+4]=N[j][1];}
 L.g.attributes.position.needsUpdate=true;group.add(L.o);
 var A=pts(22,C2,.6);group.add(A.o);
 S.spread.pointer=function(type,x,y){if(type!=='down')return;var best=0,bd=1e9;
  for(var i=0;i<22;i++){var d=(N[i][0]-x)**2+(N[i][1]-y)**2;if(d<bd){bd=d;best=i;}}
  if(bd<9)st[best]=1;};
 cleanup=function(t){for(var i=0;i<22;i++){
  for(var d of [-1,1]){var j=(i+d+22)%22;if(st[i]&&!st[j]&&Math.random()<.004)st[j]=1;}
  A.p[i*3]=N[i][0];A.p[i*3+1]=N[i][1];A.p[i*3+2]=st[i]?1:0;
  A.o.material.color.setHex(st.reduce(function(a,b){return a+b;},0)>18?C2:C1);}
  A.g.attributes.position.needsUpdate=true;};}};
/* C1 流程链 */
S.chain={cat:'C',n:'流程链',en:'FLOW CHAIN',hint:'自动依次点亮 · 点步骤标签跳到该步',
d:'五步依次点亮，走到头重来。适合讲「一个流程怎么一步步走完」。',
c:'var step = Math.floor(t / 1.2) % 5;\nfor (var i=0;i<5;i++){\n  node[i].scale = (i === step) ? 1.7 : 1;\n  link[i].opacity = (i < step) ? .8 : .2;\n}',
b:function(){var X=[-13,-6.5,0,6.5,13],nodes=[],links=[];

 for(var i=0;i<4;i++){var L=lines(1,C1,.4);L.p[0]=X[i]+.8;L.p[3]=X[i+1]-.8;
  L.g.attributes.position.needsUpdate=true;links.push(L);group.add(L.o);}
 cleanup=function(t){var step=Math.floor(t/1.2)%5;
  for(var i=0;i<5;i++){var s=i===step?1.7:1;nodes[i].scale.setScalar(s);
   nodes[i].material.opacity=i===step?1:.35;}
  for(var i=0;i<4;i++)links[i].o.material.opacity=i<step?.8:.2;};}};
/* C2 形态演变 */
S.morph={cat:'C',n:'形态演变',en:'MORPH',hint:'自动在 球 → 环 → 面 之间变形，每 4 秒一变',
d:'同一批粒子从球变成环再变成平面。适合讲「一个东西的不同形态」「转换过程」。',
c:'var phase = Math.floor(t/4) % 3;\nvar u = (t%4)/4;  // 当前阶段进度\n// 在 fromShape 和 toShape 之间插值\np[i] = lerp(from[i], to[i], smoothstep(u));',
b:function(){var A=pts(1400,C1,.15),forms=[new Float32Array(4200),new Float32Array(4200),new Float32Array(4200)];
 for(var i=0;i<1400;i++){var a=rnd(i,1)*6.283,b=Math.acos(2*rnd(i,2)-1);
  forms[0][i*3]=Math.sin(b)*Math.cos(a)*8;forms[0][i*3+1]=Math.cos(b)*8;forms[0][i*3+2]=Math.sin(b)*Math.sin(a)*8;
  forms[1][i*3]=Math.cos(a)*11;forms[1][i*3+1]=Math.sin(a)*7;forms[1][i*3+2]=(rnd(i,3)-.5)*2;
  forms[2][i*3]=(rnd(i,4)-.5)*26;forms[2][i*3+1]=(rnd(i,5)-.5)*16;forms[2][i*3+2]=0;}
 group.add(A.o);cleanup=function(t){var ph=Math.floor(t/4)%3,u=(t%4)/4;
  u=u*u*(3-2*u);var f=forms[ph],g=forms[(ph+1)%3];
  for(var i=0;i<4200;i++)A.p[i]=f[i]+(g[i]-f[i])*u;

/* C3 时间回放 */
S.scrub={cat:'C',n:'时间回放',en:'TIME SCRUB',hint:'拖底部时间条 = 回到任意时刻看粒子轨迹',

c:'// 时间条值 0..1 映射到 t\nvar t = scrubValue * DURATION;\nfor (var i=0;i<N;i++){\n  p[i*3] = base[i*3] + Math.sin(t + i*.1)*3;\n  p[i*3+1] = base[i*3+1] + Math.cos(t*.7 + i)*2;\n}',
b:function(){var A=pts(1000,C1,.15),bx=new Float32Array(1000),by=new Float32Array(1000),tv=0;
 for(var i=0;i<1000;i++){bx[i]=(rnd(i,1)-.5)*28;by[i]=(rnd(i,2)-.5)*18;}
 group.add(A.o);var tr=document.getElementById('track');tr.style.display='block';
 var sc=document.getElementById('scrub');sc.value=0;
 sc.oninput=function(){tv=+sc.value/1000;};
 cleanup=function(t){var tt=tv*20;for(var i=0;i<1000;i++){
  A.p[i*3]=bx[i]+Math.sin(tt+i*.1)*3;A.p[i*3+1]=by[i]+Math.cos(tt*.7+i)*2;}

/* D1 景深视差 */
S.depth={cat:'D',n:'景深视差',en:'DEPTH PARALLAX',hint:'移动指针 = 近处动得多、远处动得少（视差）',
d:'粒子分三层，近的跟指针跑得快，远的慢。适合讲「层次」「远近」「空间感」。',
c:'var layers = [0.3, 0.6, 1.0];  // 视差系数\nfor (var i=0;i<N;i++){\n  var k = i % 3;\n  p[i*3]   = base[i*3]   + pointer.x * layers[k] * 5;\n  p[i*3+1] = base[i*3+1] + pointer.y * layers[k] * 3;\n  p[i*3+2] = -8 + k*8;  // 三层深度\n}',
b:function(){var L=[];for(var k=0;k<3;k++){var A=pts(500,[0x3a6b88,C1,C2][k],.1+.06*k);

 cleanup=function(t){var nx=(P.wx||0)/12,ny=(P.wy||0)/8;
  L.forEach(function(o){var f=[.2,.5,1][o.k];
   for(var i=0;i<500;i++){o.A.p[i*3]=o.bx[i]+nx*f*5;o.A.p[i*3+1]=o.by[i]+ny*f*3;

S.tunnel={cat:'D',n:'隧道穿梭',en:'TUNNEL',hint:'拖动滑杆 = 控制前进速度，穿进一条光的隧道',

c:'// 粒子在圆柱面上，z 随时间推进\nvar z = ((base[i] - t*speed) % L + L) % L - L/2;\np[i*3] = Math.cos(a)*R;\np[i*3+1] = Math.sin(a)*R;\np[i*3+2] = z;',
b:function(){var A=pts(1800,C1,.14),an=new Float32Array(1800),zz=new Float32Array(1800);

var ORDER=['gravity','brush','ripple','params','packets','traffic','scan','spread','chain','morph','scrub','depth','tunnel'];
function buildGrid(){var g=document.getElementById('grid');ORDER.forEach(function(k){
 var s=S[k],b=document.createElement('button');b.dataset.id=k;
 var sm=document.createElement('small');sm.textContent=s.cat+' · '+s.en.slice(0,4);
 b.appendChild(sm);b.appendChild(document.createTextNode(s.n));
 b.addEventListener('click',function(){setMode(k);});g.appendChild(b);});}
function setMode(k){cur=k;clear();var s=S[k];s.b();
 document.getElementById('ttl').textContent=s.n;document.getElementById('en').textContent=s.en;
 document.getElementById('desc').textContent=s.d;document.getElementById('code').textContent=s.c;
 document.getElementById('hint').textContent=s.hint;document.getElementById('badge').textContent=s.en;
 var bs=document.querySelectorAll('#grid button');for(var i=0;i<bs.length;i++)
  bs[i].setAttribute('aria-current',bs[i].dataset.id===k?'true':'false');
 camera.position.set(0,0,26);camera.lookAt(0,0,0);}
function frame(){if(!renderer)return;requestAnimationFrame(frame);
 var t=reduce?0:clock.getElapsedTime();if(cleanup)cleanup(t);renderer.render(scene,camera);}
document.getElementById('copy').addEventListener('click',function(){
 var txt=document.getElementById('code').textContent;
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){
  var b=document.getElementById('copy');b.textContent='已复制';setTimeout(function(){b.textContent='复制代码';},1400);});});
buildGrid();setMode('gravity');if(renderer){clock=new THREE.Clock();frame();}
