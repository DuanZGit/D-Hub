<!DOCTYPE html>
<!--
  show-me 动效模板库 · 16 组 Three.js 动效  motion-16.html
  ────────────────────────────────────────────────
  什么时候用：需要给讲解页找一个「动起来」的背景或主视觉，从 16 组里挑一组直接用。
  结构：顶部 16 个入口 → 左侧实时预览（Three.js）→ 右侧说明 + 核心代码 + 一键复制。

  改：
    1. 复制某个 builder 的 build() 和 code 到你自己的页面，删掉其余 15 组
    2. 改配色：THEME 常量（粒子色 / 强调色 / 背景色）
    3. 改密度：每个 builder 里的 N 值
    4. 改速度：update(t) 里的系数
  硬约束：单文件、内联 Three.js 无外链、禁 innerHTML、prefers-reduced-motion 已兜底。
  16 组：尘埃 / 漩涡 / 引力井 / 流场 / 光纤 / 星链 / 波纹 / 双螺旋 / 晶格 / 波面 /
        爆发 / 雷达 / 数据雨 / 球云 / 莫比乌斯 / 轨道环
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>show-me · 16 组 Three.js 动效</title>
<style>
:root{--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 --bg:#080c12;--panel:#101822;--line:#223040;--fg:#e8eef6;--fg2:#96a3b6;--fg3:#5d6b7d;
 --c1:#7ad7ff;--c2:#ff8a5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.7 var(--sans)}
header{padding:22px 28px 16px;border-bottom:1px solid var(--line);max-width:1400px;margin:0 auto}
header h1{font:750 clamp(22px,3vw,32px)/1.2 var(--sans);letter-spacing:-.02em;margin:0 0 8px}
header p{margin:0;color:var(--fg2);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;max-width:1400px;margin:18px auto;padding:0 28px}
.grid button{cursor:pointer;background:var(--panel);border:1px solid var(--line);color:var(--fg2);
 border-radius:8px;padding:11px 10px;text-align:left;font:600 12px/1.4 var(--sans);transition:border-color .18s,color .18s}
.grid button small{display:block;font:600 10px/1 var(--mono);color:var(--fg3);margin-bottom:6px;letter-spacing:.08em}
.grid button[aria-current="true"]{border-color:var(--c1);color:var(--c1)}
.grid button[aria-current="true"] small{color:var(--c2)}
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px;max-width:1400px;margin:0 auto;padding:0 28px 60px}
.stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#05080d;aspect-ratio:16/10}
.stage canvas{width:100%;height:100%;display:block}
.stage .badge{position:absolute;left:16px;top:14px;font:600 11px/1 var(--mono);letter-spacing:.12em;
 color:var(--c1);background:rgba(8,12,18,.7);padding:8px 10px;border-radius:6px;border:1px solid var(--line)}
.info{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:22px;display:flex;flex-direction:column;min-height:0}
.info h2{font:750 24px/1.3 var(--sans);margin:0 0 6px}
.info .en{font:600 11px/1 var(--mono);letter-spacing:.14em;color:var(--c2);margin-bottom:18px}
.info .desc{color:var(--fg2);font-size:14px;margin:0 0 22px}
.info .lab{font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--fg3);margin-bottom:10px}
pre{flex:1;min-height:160px;max-height:340px;overflow:auto;margin:0 0 16px;padding:16px;
 background:#070b11;border:1px solid var(--line);border-radius:8px;color:#b9d9e8;
 font:12px/1.7 var(--mono);white-space:pre-wrap;word-break:break-all}
.copy{cursor:pointer;align-self:flex-start;border:1px solid var(--c1);color:var(--c1);background:transparent;
 border-radius:7px;padding:9px 16px;font:600 12px/1 var(--sans)}
.copy:hover{background:rgba(122,215,255,.1)}
@media(max-width:980px){.grid{grid-template-columns:repeat(4,1fr)}.main{grid-template-columns:1fr}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.main{padding:0 14px 40px}.grid{padding:0 14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1>16 组 Three.js 动效</h1><p>点选切换 · 右侧是可复制的核心代码 · 全部单文件内联，无外链</p></header>
<div class="grid" id="grid"></div>
<div class="main">
 <div class="stage"><canvas id="gl"></canvas><div class="badge" id="badge"></div></div>
 <div class="info"><h2 id="ttl"></h2><div class="en" id="en"></div><p class="desc" id="desc"></p>
  <div class="lab">核心代码 / COPY</div><pre id="code"></pre><button class="copy" id="copy">复制代码</button></div>
</div>
<script src="assets/three.min.js"></script>
<script>
(function(){
"use strict";
var C1=0x7ad7ff,C2=0xff8a5b,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var canvas=document.getElementById('gl'),renderer,clock,cleanup=null,cur='dust';
var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(52,1,.1,200),group=new THREE.Group();
camera.position.z=24;scene.add(group);
try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});}catch(e){canvas.style.display='none';}
if(renderer){
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
 clock=new THREE.Clock();renderer.setClearColor(0x05080d,1);
 new ResizeObserver(function(){var w=canvas.clientWidth,h=canvas.clientHeight;
  if(w&&h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}).observe(canvas);
}
function pts(n,color,size){var p=new Float32Array(n*3),g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(p,3));
 var o=new THREE.Points(g,new THREE.PointsMaterial({color:color,size:size||.12,transparent:true,opacity:.85,
  depthWrite:false,blending:THREE.AdditiveBlending}));return {o:o,p:p,g:g};}
function lines(n,color){var p=new Float32Array(n*2*3),g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(p,3));
 var o=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:color,transparent:true,opacity:.24,
  blending:THREE.AdditiveBlending,depthWrite:false}));return {o:o,p:p,g:g};}
function R(i){return Math.sin(i*127.1)*43758.5453%1;}
function rnd(i,k){var x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);}
function clear(){while(group.children.length){var o=group.children[0];group.remove(o);
  if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();}cleanup=null;}
var M={};
M.dust={n:'尘埃漂移',en:'DUST DRIFT',d:'最安静的一档。粒子在三维空间里缓慢漂浮，适合不需要抢注意力的背景。',
c:'var pts = makePoints(900);\nfunction update(t){\n  for (var i=0;i<N;i++){\n    p[i*3]   = base[i*3]   + Math.sin(t*.16+i)*.5;\n    p[i*3+1] = base[i*3+1] + Math.cos(t*.12+i*.7)*.4;\n  }\n  geometry.attributes.position.needsUpdate = true;\n}',
b:function(){var A=pts(900,C1,.1),b=new Float32Array(2700);
 for(var i=0;i<900;i++){b[i*3]=(rnd(i,1)-.5)*30;b[i*3+1]=(rnd(i,2)-.5)*18;b[i*3+2]=(rnd(i,3)-.5)*14;}
 group.add(A.o);cleanup=function(t){for(var i=0;i<900;i++){
  A.p[i*3]=b[i*3]+Math.sin(t*.16+i*.3)*.5;A.p[i*3+1]=b[i*3+1]+Math.cos(t*.12+i*.7)*.4;}
  A.g.attributes.position.needsUpdate=true;};}};
M.vortex={n:'漩涡',en:'VORTEX',d:'粒子绕中心轴旋转并向内收拢，适合表达「汇聚」「聚焦」一类关系。',
c:'function update(t){\n  for (var i=0;i<N;i++){\n    var a = base[i].a + t*(.4+base[i].r*.3);\n    var r = base[i].r*(.6+.4*Math.sin(t*.5+i));\n    p[i*3]   = Math.cos(a)*r;\n    p[i*3+1] = (rnd(i,4)-.5)*8 + Math.sin(t+i)*.3;\n    p[i*3+2] = Math.sin(a)*r;\n  }\n}',
b:function(){var A=pts(1100,C1,.12),ax=new Float32Array(1100),rr=new Float32Array(1100);
 for(var i=0;i<1100;i++){ax[i]=rnd(i,1)*6.28;rr[i]=2+rnd(i,2)*12;}
 group.add(A.o);cleanup=function(t){for(var i=0;i<1100;i++){
  var a=ax[i]+t*(.3+rr[i]*.02),r=rr[i]*(.72+.28*Math.sin(t*.6+i*.1));
  A.p[i*3]=Math.cos(a)*r;A.p[i*3+1]=(rnd(i,4)-.5)*7+Math.sin(t+i)*.3;A.p[i*3+2]=Math.sin(a)*r;}
  A.g.attributes.position.needsUpdate=true;};}};
M.gravity={n:'引力井',en:'GRAVITY WELL',d:'粒子被中心拉住又甩出去，形成轨道感。适合讲「核心与外围」「依赖关系」。',
c:'function update(t){\n  for (var i=0;i<N;i++){\n    var r = base[i].r*(.8+.2*Math.sin(t*.8+i));\n    var a = base[i].a + t*base[i].w;\n    p[i*3]   = Math.cos(a)*r;\n    p[i*3+1] = Math.sin(a*1.7)*r*.35;\n    p[i*3+2] = Math.sin(a)*r;\n  }\n}',
b:function(){var A=pts(900,C1,.16),an=new Float32Array(900),rr=new Float32Array(900),ww=new Float32Array(900);
 for(var i=0;i<900;i++){an[i]=rnd(i,1)*6.28;rr[i]=3+rnd(i,2)*10;ww[i]=.2+1.2/(rr[i]*.3);}
 group.add(A.o);cleanup=function(t){for(var i=0;i<900;i++){
  var r=rr[i]*(.82+.18*Math.sin(t*.8+i*.2)),a=an[i]+t*ww[i];
  A.p[i*3]=Math.cos(a)*r;A.p[i*3+1]=Math.sin(a*1.7)*r*.35;A.p[i*3+2]=Math.sin(a)*r;}
  A.g.attributes.position.needsUpdate=true;};}};
M.flow={n:'流场',en:'FLOW FIELD',d:'粒子沿连续曲面被推着走，形成河流一样的轨迹。适合表达「趋势」「演进」。',
c:'function update(t){\n  for (var i=0;i<N;i++){\n    var x = base[i*3] + t*.6*(.4+rnd(i,1));\n    p[i*3]   = ((x+15)%30)-15;\n    p[i*3+1] = Math.sin(x*.35+i*.1)*3 + Math.sin(t+i)*.3;\n    p[i*3+2] = Math.cos(x*.28+i*.2)*4;\n  }\n}',
b:function(){var A=pts(1200,C1,.1),bx=new Float32Array(1200);
 for(var i=0;i<1200;i++)bx[i]=(rnd(i,1)-.5)*30;
 group.add(A.o);cleanup=function(t){for(var i=0;i<1200;i++){
  var x=bx[i]+t*(.5+rnd(i,2)*.8);x=(x+15)%30-15;
  A.p[i*3]=x;A.p[i*3+1]=Math.sin(x*.35+i*.1)*3+Math.sin(t+i)*.3;A.p[i*3+2]=Math.cos(x*.28+i*.2)*4;}
  A.g.attributes.position.needsUpdate=true;};}};
M.fiber={n:'光纤脉冲',en:'FIBER OPTIC',d:'亮点沿曲线成串前进。适合讲「数据流动」「信号传输」。',
c:'var curve = new THREE.CatmullRomCurve3(points);\nfunction update(t){\n  for (var i=0;i<N;i++){\n    var u = (i/N + t*.08) % 1;\n    var v = curve.getPoint(u);\n    p[i*3] = v.x; p[i*3+1] = v.y; p[i*3+2] = v.z;\n  }\n}',
b:function(){var P=[],ptsArr=[];for(var k=0;k<7;k++)ptsArr.push(new THREE.Vector3(
  -14+k*4.6,Math.sin(k*1.1)*4,Math.cos(k*.8)*4));
 var curve=new THREE.CatmullRomCurve3(ptsArr);
 var A=pts(700,C1,.16);group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
  curve.getPoints(140)),new THREE.LineBasicMaterial({color:0x2c5a72,transparent:true,opacity:.4})));
 group.add(A.o);cleanup=function(t){for(var i=0;i<700;i++){
  var v=curve.getPoint((i/700+t*.09)%1);A.p[i*3]=v.x;A.p[i*3+1]=v.y;A.p[i*3+2]=v.z;}
  A.g.attributes.position.needsUpdate=true;};}};
M.starlink={n:'星链',en:'STAR LINK',d:'点之间按距离连线，靠近时自动成网。适合表达「关系网络」「社群」。',
c:'function update(t){\n  // 每帧遍历点对，距离小于阈值就写一条线段\n  var k=0;\n  for (var i=0;i<N;i++) for (var j=i+1;j<N;j++){\n    if (dist(i,j) < 3.4){ line[k++] = i; line[k++] = j; }\n  }\n  lineGeometry.setDrawRange(0,k);\n}',
b:function(){var A=pts(150,C2,.32),L=lines(150*149/2,C1),bx=new Float32Array(450),by=new Float32Array(450),bz=new Float32Array(450);
 for(var i=0;i<150;i++){bx[i]=(rnd(i,1)-.5)*20;by[i]=(rnd(i,2)-.5)*12;bz[i]=(rnd(i,3)-.5)*10;}
 group.add(A.o);group.add(L.o);cleanup=function(t){var k=0;
  for(var i=0;i<150;i++){A.p[i*3]=bx[i]+Math.sin(t*.3+i)*.6;A.p[i*3+1]=by[i]+Math.cos(t*.25+i*.7)*.5;A.p[i*3+2]=bz[i];}
  for(var i=0;i<150;i++)for(var j=i+1;j<150;j++){
   var dx=A.p[i*3]-A.p[j*3],dy=A.p[i*3+1]-A.p[j*3+1],dz=A.p[i*3+2]-A.p[j*3+2];
   if(dx*dx+dy*dy+dz*dz<8){L.p[k*3]=A.p[i*3];L.p[k*3+1]=A.p[i*3+1];L.p[k*3+2]=A.p[i*3+2];k++;
    L.p[k*3]=A.p[j*3];L.p[k*3+1]=A.p[j*3+1];L.p[k*3+2]=A.p[j*3+2];k++;}}
  L.g.setDrawRange(0,k);A.g.attributes.position.needsUpdate=true;L.g.attributes.position.needsUpdate=true;};}};
M.ripple={n:'波纹',en:'RIPPLE',d:'同心圆环一圈圈向外扩散。适合表达「影响范围」「层层传导」。',
c:'for (var ring=0; ring<12; ring++){\n  var r = ((t*.9 + ring) % 12) / 12 * 14;\n  for (var i=0;i<100;i++){\n    var a = i/100 * Math.PI*2;\n    p[k++] = Math.cos(a)*r;\n    p[k++] = Math.sin(a)*r*.5;\n  }\n}',
b:function(){var A=pts(1200,C1,.12);group.add(A.o);cleanup=function(t){var k=0;
 for(var ring=0;ring<12;ring++){var r=((t*.8+ring)%12)/12*14;
  for(var i=0;i<100;i++){var a=i/100*6.283;A.p[k++]=Math.cos(a)*r;A.p[k++]=Math.sin(a)*r*.55;A.p[k++]=Math.sin(a*2+t)*.6;}}
 A.g.attributes.position.needsUpdate=true;};}};
M.helix={n:'双螺旋',en:'DOUBLE HELIX',d:'两条链互相缠绕向上。适合讲「双轨」「两条线并行」。',
c:'var y = (i/N - .5) * 18;\nvar a = y*.8 + t;\nvar side = i%2 ? 1 : -1;\np[i*3]   = Math.cos(a)*3*side;\np[i*3+1] = y;\np[i*3+2] = Math.sin(a)*3*side;',
b:function(){var A=pts(900,C1,.15),B=pts(900,C2,.12);group.add(A.o);group.add(B.o);
 cleanup=function(t){for(var i=0;i<900;i++){
  var y=(i/900-.5)*18,a=y*.8+t;
  A.p[i*3]=Math.cos(a)*3;A.p[i*3+1]=y;A.p[i*3+2]=Math.sin(a)*3;
  B.p[i*3]=-Math.cos(a)*3;B.p[i*3+1]=y;B.p[i*3+2]=-Math.sin(a)*3;}
  A.g.attributes.position.needsUpdate=true;B.g.attributes.position.needsUpdate=true;};}};
M.lattice={n:'立方晶格',en:'LATTICE',d:'规则点阵整体呼吸、轻微错动。适合表达「结构」「模块」「矩阵」。',
c:'for (var x=0;x<8;x++) for (var y=0;y<8;y++) for (var z=0;z<8;z++){\n  p[k++] = (x-3.5)*2 + Math.sin(t+x)*.2;\n  p[k++] = (y-3.5)*2 + Math.sin(t+y)*.2;\n  p[k++] = (z-3.5)*2 + Math.sin(t+z)*.2;\n}',
b:function(){var A=pts(512,C1,.18);group.add(A.o);cleanup=function(t){var k=0;
 for(var x=0;x<8;x++)for(var y=0;y<8;y++)for(var z=0;z<8;z++){
  A.p[k++]=(x-3.5)*2+Math.sin(t+x*.6)*.25;A.p[k++]=(y-3.5)*2+Math.sin(t+y*.6)*.25;
  A.p[k++]=(z-3.5)*2+Math.sin(t+z*.6)*.25;}
 A.g.attributes.position.needsUpdate=true;};}};
M.wave={n:'波面',en:'WAVE GRID',d:'网格平面起伏成波。适合讲「趋势面」「分布」「地形」。',
c:'for (var x=0;x<40;x++) for (var z=0;z<40;z++){\n  p[k++] = (x-20)*.8;\n  p[k++] = Math.sin(x*.3+t)*Math.cos(z*.3+t)*2.4;\n  p[k++] = (z-20)*.8;\n}',
b:function(){var A=pts(1600,C1,.13);group.add(A.o);camera.position.y=8;camera.lookAt(0,0,0);
 cleanup=function(t){var k=0;for(var x=0;x<40;x++)for(var z=0;z<40;z++){
  A.p[k++]=(x-20)*.8;A.p[k++]=Math.sin(x*.3+t)*Math.cos(z*.3+t)*2.4;A.p[k++]=(z-20)*.8;}
  A.g.attributes.position.needsUpdate=true;};}};
M.burst={n:'爆发',en:'BURST',d:'粒子从中心向外喷射再回收。适合表达「触发」「启动」「扩散」。',
c:'var phase = (t*.4) % 1;\nvar r = phase * 16;\np[i*3] = dir[i*3] * r;\np[i*3+1] = dir[i*3+1] * r;\np[i*3+2] = dir[i*3+2] * r;',
b:function(){var A=pts(1200,C2,.15),dir=new Float32Array(3600);
 for(var i=0;i<1200;i++){var a=rnd(i,1)*6.283,b=Math.acos(2*rnd(i,2)-1);
  dir[i*3]=Math.sin(b)*Math.cos(a);dir[i*3+1]=Math.cos(b);dir[i*3+2]=Math.sin(b)*Math.sin(a);}
 group.add(A.o);cleanup=function(t){var ph=(t*.35)%1,r=ph*16;
  for(var i=0;i<1200;i++){var f=r*(.7+rnd(i,3)*.6);
   A.p[i*3]=dir[i*3]*f;A.p[i*3+1]=dir[i*3+1]*f;A.p[i*3+2]=dir[i*3+2]*f;}
  A.g.attributes.position.needsUpdate=true;};}};
M.radar={n:'雷达扫描',en:'RADAR SWEEP',d:'一道扇形扫过，遇到目标就亮起。适合讲「监测」「发现」「巡检」。',
c:'var sweep = t*1.2 % (Math.PI*2);\nvar diff = Math.abs(((a - sweep + Math.PI*3) % (Math.PI*2)) - Math.PI);\nvar alpha = diff < .25 ? 1 : .08;',
b:function(){var A=pts(700,C1,.16),B=pts(60,C2,.5),rr=new Float32Array(700),aa=new Float32Array(700);
 for(var i=0;i<700;i++){rr[i]=2+rnd(i,1)*12;aa[i]=rnd(i,2)*6.283;}
 for(var i=0;i<60;i++){var r=3+rnd(i,4)*9,a=rnd(i,5)*6.283;
  B.p[i*3]=Math.cos(a)*r;B.p[i*3+1]=Math.sin(a)*r;B.p[i*3+2]=0;}
 B.g.attributes.position.needsUpdate=true;group.add(A.o);group.add(B.o);
 cleanup=function(t){var sw=t*1.1%(6.283);for(var i=0;i<700;i++){
  var d=Math.abs(((aa[i]-sw+9.42)%6.283)-3.14159);
  var sz=d<.22?.28:.06;A.o.material.size=sz;
  A.p[i*3]=Math.cos(aa[i])*rr[i];A.p[i*3+1]=Math.sin(aa[i])*rr[i];A.p[i*3+2]=0;}
  A.g.attributes.position.needsUpdate=true;};}};
M.rain={n:'数据雨',en:'DATA RAIN',d:'字符一样的光点垂直下落。适合做「代码」「日志」「数据流」的背景。',
c:'var y = ((base[i] - t*speed) % 20 + 20) % 20 - 10;\np[i*3] = x;\np[i*3+1] = y;\np[i*3+2] = z;',

function buildGrid(){var g=document.getElementById('grid');KEYS.forEach(function(k){

function setMode(k){cur=k;clear();var m=M[k];m.b();
 document.getElementById('ttl').textContent=m.n;document.getElementById('en').textContent=m.en;
 document.getElementById('desc').textContent=m.d;document.getElementById('code').textContent=m.c;
 document.getElementById('badge').textContent=m.en;
 var bs=document.querySelectorAll('#grid button');for(var i=0;i<bs.length;i++)
  bs[i].setAttribute('aria-current',bs[i].dataset.id===k?'true':'false');
 camera.position.set(0,0,24);camera.lookAt(0,0,0);}
function frame(){if(!renderer)return;requestAnimationFrame(frame);
 var t=reduce?0:clock.getElapsedTime();if(cleanup)cleanup(t);
 renderer.render(scene,camera);}
