[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d-hub"
version = "0.1.0"
description = "D-Hub: one-process multi-agent coordination layer"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "whoosh>=2.7.4"
]

[project.optional-dependencies]
memory = ["mem0ai>=0.1"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
dhub-agent-sync = "dhub.agent_sync:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dhub = ["ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
