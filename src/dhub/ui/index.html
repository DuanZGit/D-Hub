<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="d-hub 多 Agent 协调服务管理台">
  <title>d-hub 控制台</title>
  <style>
    :root{font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:#182024;background:#edf1f2;--ink:#182024;--muted:#667378;--line:#d5dcde;--panel:#fff;--accent:#c94f2d;--accent-dark:#a63d20;--ok:#26734d;--bad:#a72d35;--nav:#20292d;letter-spacing:0}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px}.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px;z-index:3}.skip:focus{left:8px}.topbar{background:var(--nav);color:#fff;padding:18px clamp(16px,4vw,36px);display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:baseline;gap:12px}.brand strong{font:700 1.35rem/1 ui-monospace,Consolas,monospace}.brand span{color:#b9c4c7;font-size:.9rem}.status{display:flex;align-items:center;gap:8px;color:#d8e0e2;font:600 .82rem ui-monospace,Consolas,monospace}.dot{width:9px;height:9px;border-radius:50%;background:#889397}.dot.ok{background:#5db788}.dot.bad{background:#dc6670}nav{display:flex;gap:2px;overflow:auto;padding:0 clamp(12px,3vw,28px);background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}button,.button{font:600 .9rem/1 system-ui;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);padding:10px 13px;cursor:pointer;transition:background-color .18s,border-color .18s,transform .18s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}button:hover,.button:hover{background:#f2f5f5;border-color:#aebabc}button:active,.button:active{transform:translateY(1px)}button:focus-visible,.button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e8a58f;outline-offset:2px}nav button{border:0;border-radius:0;background:transparent;color:#526064;white-space:nowrap;padding:14px 12px;border-bottom:3px solid transparent}nav button.active{color:var(--accent-dark);border-bottom-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.primary:hover{background:var(--accent-dark)}button.danger{color:var(--bad);border-color:#e2b9bd}main{padding:22px clamp(14px,3vw,32px) 48px;max-width:1380px;margin:auto}.page-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:2px 0 18px}.page-head h1{font-size:1.45rem;margin:0}.page-head p{margin:3px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:1/-1}.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:18px;min-width:0}.panel h2{font-size:1rem;margin:0 0 14px}.metric{font:700 2rem/1.15 ui-monospace,Consolas,monospace;margin:5px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}.muted{color:var(--muted)}.stack>*+*{margin-top:10px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{width:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.form-grid .wide{grid-column:1/-1}label{display:block;font-size:.8rem;font-weight:650;color:#536064;margin:0 0 4px}input,textarea,select{width:100%;font:inherit;color:inherit;padding:9px 10px;margin:0 0 12px;border:1px solid #bdc7c9;border-radius:4px;background:#fff}textarea{min-height:130px;resize:vertical;font-family:ui-monospace,Consolas,monospace}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #e3e8e9;vertical-align:top}th{color:#5a676b;font-size:.75rem;font-weight:700}td.actions{white-space:nowrap;width:1%}pre{white-space:pre-wrap;overflow:auto;max-height:55vh;background:#f3f6f6;border:1px solid #e0e5e6;padding:12px;border-radius:4px;font:12px/1.55 ui-monospace,Consolas,monospace}.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed #c6d0d2;border-radius:5px}.notice{position:fixed;right:18px;bottom:18px;max-width:min(420px,calc(100vw - 36px));padding:12px 15px;border-radius:5px;background:#253035;color:#fff;box-shadow:0 8px 28px #25303533;z-index:4}.notice.bad{background:#862a31;color:#fff}.hidden{display:none!important}.skeleton{height:110px;background:linear-gradient(90deg,#e7ebec 25%,#f5f7f7 50%,#e7ebec 75%);background-size:200% 100%;animation:load 1.2s infinite;border-radius:5px}@keyframes load{to{background-position:-200% 0}}@media(max-width:820px){.brand span{display:none}.span-4,.span-5,.span-7,.span-8{grid-column:1/-1}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.page-head{align-items:start;flex-direction:column}main{padding-top:16px}.panel{padding:14px}table{display:block;overflow:auto}}
    .status button{padding:7px 9px;background:#2d393e;border-color:#526166;color:#fff}dialog{width:min(430px,calc(100vw - 28px));border:1px solid var(--line);border-radius:7px;padding:20px;box-shadow:0 18px 60px #15202455}dialog::backdrop{background:#12191c99}
  </style>
</head>
<body>
  <a class="skip" href="#app">跳到主要内容</a>
  <header class="topbar"><div class="brand"><strong>d-hub</strong><span>Multi-Agent Coordination Layer</span></div><div class="status"><i id="health-dot" class="dot"></i><span id="health-label">正在连接</span><button type="button" onclick="setApiKey()">访问密钥</button></div></header>
  <nav id="nav" aria-label="主导航"></nav>
  <main id="app" tabindex="-1"></main>
  <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
  <dialog id="key-dialog"><form id="key-form"><h2>访问密钥</h2><p class="muted">密钥只保存在当前浏览器标签页中。</p><label>DHUB_API_KEY</label><input name="api_key" type="password" autocomplete="current-password"><div class="row"><button class="primary">应用</button><button type="button" onclick="$('#key-dialog').close()">取消</button><button type="button" class="danger" onclick="clearApiKey()">清除</button></div></form></dialog>
  <script>
    const tabs=[['overview','总览'],['agents','Agent'],['mcp','MCP'],['memory','记忆'],['wiki','Wiki'],['skills','技能'],['files','文件'],['sync','同步'],['logs','日志'],['config','配置'],['backup','备份']];
    const descriptions={overview:'服务运行状态与模块概览',agents:'注册、查看和移除 Agent',mcp:'管理分层上游并查看合并结果',memory:'浏览、写入和搜索隔离记忆',wiki:'维护 Markdown 知识页面',skills:'管理三层技能仓库',files:'上传、下载和清理共享文件',sync:'运行记忆与 Wiki 语义同步',logs:'查看最近审计事件',config:'核对当前运行配置',backup:'创建和恢复数据备份'};
    let current=(location.hash||'#overview').slice(1), noticeTimer, apiKey=sessionStorage.getItem('dhub-api-key')||'';
    const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), enc=x=>encodeURIComponent(x).replace(/'/g,'%27');
    async function api(url,opt={}){const options={...opt},headers={...(options.headers||{})};if(apiKey)headers.Authorization='Bearer '+apiKey;if(options.body&&!(options.body instanceof FormData)){headers['Content-Type']='application/json';if(typeof options.body!=='string')options.body=JSON.stringify(options.body)}options.headers=headers;const r=await fetch(url,options),j=await r.json().catch(()=>({detail:r.statusText}));if(r.status===401)setApiKey();if(!r.ok)throw Error(j.detail||r.statusText);return j}
    function notify(message,bad=false){const n=$('#notice');n.textContent=message;n.className='notice'+(bad?' bad':'');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.classList.add('hidden'),4200)}
    function navs(){const known=tabs.some(x=>x[0]===current);if(!known)current='overview';$('#nav').innerHTML=tabs.map(([id,label])=>`<button class="${id===current?'active':''}" aria-current="${id===current?'page':'false'}" onclick="go('${id}')">${label}</button>`).join('')}
    function heading(t,action=''){return `<header class="page-head"><div><h1>${esc(tabs.find(x=>x[0]===t)?.[1]||t)}</h1><p>${esc(descriptions[t]||'')}</p></div>${action}</header>`}
    function panel(title,body,span='span-12'){return `<section class="panel ${span}"><h2>${esc(title)}</h2>${body}</section>`}
    function empty(text){return `<div class="empty">${esc(text)}</div>`}
    function json(x){return `<pre>${esc(JSON.stringify(x,null,2))}</pre>`}
    function formValues(form){return Object.fromEntries(new FormData(form).entries())}
    async function go(t){current=t;location.hash=t;navs();$('#app').innerHTML=heading(t)+`<div class="grid"><div class="skeleton span-12"></div></div>`;try{const data=await api('/dashboard/'+t);$('#app').innerHTML=heading(t)+view(t,data)}catch(e){$('#app').innerHTML=heading(t)+panel('加载失败',`<p class="bad">${esc(e.message)}</p><button onclick="go(current)">重试</button>`);notify(e.message,true)}}
    function view(t,d){if(t==='overview')return `<div class="grid">${panel('服务状态',`<div class="metric ${d.status==='ok'?'ok':'bad'}">${esc(d.status)}</div><p class="muted">版本 ${esc(d.version)} · 运行 ${esc(d.uptime_seconds)} 秒</p>`,'span-4')}${panel('请求计数',`<div class="metric">${esc(d.requests)}</div><p class="muted">本次进程累计 HTTP 请求</p>`,'span-4')}${panel('记忆后端',`<div class="metric">${esc(d.memory_backend)}</div><p class="muted">${esc(d.memory_error||'配置正常')}</p>`,'span-4')}${panel('已加载模块',`<div class="row">${d.modules.map(x=>`<button onclick="go('${x==='registry'?'agents':x}')">${esc(x)}</button>`).join('')}</div>`,'span-12')}</div>`;
      if(t==='agents'){const rows=d.agents||[];return `<div class="grid">${panel('注册 Agent',`<form data-kind="agent" class="form-grid"><div><label>Agent ID</label><input name="agent_id" required pattern="[A-Za-z0-9._-]+"></div><div><label>回调 URL</label><input name="url" type="url" placeholder="http://host/callback"></div><div class="wide"><button class="primary">保存 Agent</button></div></form>`,'span-5')}${panel('Agent 列表',rows.length?`<table><thead><tr><th>ID</th><th>状态</th><th>回调</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.agent_id)}</td><td>${x.enabled!==false?'启用':'停用'}</td><td>${esc(x.url||'未配置')}</td><td class="actions"><button class="danger" onclick="removeAgent('${encodeURIComponent(x.agent_id)}')">删除</button></td></tr>`).join('')}</tbody></table>`:empty('尚未注册 Agent'),'span-7')}</div>`}
      if(t==='mcp'){const configs=d.configs||{},rows=Object.entries(configs);return `<div class="grid">${panel('保存全局 MCP 上游',`<form data-kind="mcp" class="form-grid"><input type="hidden" name="namespace" value="global"><div><label>作用域</label><input value="global" readonly></div><div><label>Server ID</label><input name="server_id" required pattern="[A-Za-z0-9._-]+"></div><div class="wide"><label>JSON 配置</label><textarea name="config" required>{"transport":"http","url":"http://127.0.0.1:8000/mcp"}</textarea></div><div class="wide"><button class="primary">保存配置</button></div></form>`,'span-5')}${panel('当前全局配置',rows.length?`<table><thead><tr><th>Server</th><th>Transport</th><th>Endpoint</th><th></th></tr></thead><tbody>${rows.map(([id,c])=>`<tr><td>${esc(id)}</td><td>${esc(c.transport||'http')}</td><td>${esc(c.url||c.command||'静态工具')}</td><td class="actions"><button class="danger" onclick="removeMcp('${encodeURIComponent(id)}')">删除</button></td></tr>`).join('')}</tbody></table>`:empty('尚无 MCP 上游配置'),'span-7')}</div>`}
      if(t==='memory'){const rows=d.results||[];return `<div class="grid">${panel('添加共识记忆',`<form data-kind="memory" class="form-grid"><input type="hidden" name="namespace" value="global"><input type="hidden" name="agent_id" value="shared"><div class="wide"><label>作用域</label><input value="global / shared" readonly></div><div class="wide"><label>内容</label><textarea name="content" required></textarea></div><div class="wide"><button class="primary">添加记忆</button></div></form>`,'span-5')}${panel('共识记忆',rows.length?`<div class="stack">${rows.map(x=>`<article><p>${esc(x.memory||x.content)}</p><div class="row"><small class="muted">${esc(x.created_at||'')}</small><button class="danger" onclick="removeMemory('${encodeURIComponent(x.id)}')">删除</button></div></article>`).join('')}</div>`:empty('共识层暂无记忆'),'span-7')}</div>`}
      if(t==='wiki'){const pages=d.pages||[];return `<div class="grid">${panel('编辑全局页面',`<form data-kind="wiki" class="form-grid"><input type="hidden" name="namespace" value="global"><div><label>作用域</label><input value="global" readonly></div><div><label>标题</label><input name="title" required></div><div class="wide"><label>Markdown 内容</label><textarea name="content" required></textarea></div><div class="wide row"><button class="primary">保存页面</button><button type="button" onclick="loadWiki()">载入页面</button></div></form>`,'span-7')}${panel('全局页面',pages.length?`<table><tbody>${pages.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.size)} B</td><td class="actions"><button onclick="loadWiki('${enc(x.title)}')">编辑</button><button class="danger" onclick="removeWiki('${enc(x.title)}')">删除</button></td></tr>`).join('')}</tbody></table>`:empty('尚无 Wiki 页面'),'span-5')}</div>`}
      if(t==='skills'){const rows=d.skills||[];return `<div class="grid">${panel('保存全局技能',`<form data-kind="skill" class="form-grid"><input type="hidden" name="namespace" value="global"><div><label>作用域</label><input value="global" readonly></div><div><label>技能名</label><input name="name" required></div><div class="wide"><label>SKILL.md</label><textarea name="content" required></textarea></div><div class="wide"><button class="primary">保存技能</button></div></form>`,'span-7')}${panel('全局技能',rows.length?`<table><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.source)}</td><td class="actions"><button onclick="loadSkill('${encodeURIComponent(x.name)}')">查看</button></td></tr>`).join('')}</tbody></table>`:empty('尚无技能'),'span-5')}</div>`}
      if(t==='files'){const rows=d.files||[];return `<div class="grid">${panel('上传全局文件',`<form data-kind="file"><input type="hidden" name="namespace" value="global"><label>作用域</label><input value="global" readonly><label>文件</label><input type="file" name="file" required><button class="primary">上传文件</button></form>`,'span-5')}${panel('全局文件',rows.length?`<table><thead><tr><th>文件</th><th>大小</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.file)}</td><td>${esc(x.size)} B</td><td class="actions"><button onclick="downloadFile('${enc(x.file)}')">下载</button><button class="danger" onclick="removeFile('${enc(x.file)}')">删除</button></td></tr>`).join('')}</tbody></table>`:empty('尚无共享文件'),'span-7')}</div>`}
      if(t==='sync')return `<div class="grid">${panel('语义同步',`<p>${d.ready?'模型凭据已就绪':'缺少模型凭据，同步会记录为 blocked'}</p><button class="primary" onclick="runAction('/sync/trigger','同步已完成')">立即同步</button>`,'span-4')}${panel('最近记录',(d.history||[]).length?json(d.history):empty('尚无同步记录'),'span-8')}</div>`;
      if(t==='backup'){const rows=d.backups||[];return `<div class="grid">${panel('创建备份',`<p class="muted">归档配置、Wiki、技能、文件和本地数据。</p><button class="primary" onclick="runAction('/backup','备份已创建')">立即备份</button>`,'span-4')}${panel('备份历史',rows.length?`<table><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.size)} B</td><td class="actions"><button class="danger" onclick="restoreBackup('${encodeURIComponent(x.name)}')">恢复</button></td></tr>`).join('')}</tbody></table>`:empty('尚无备份'),'span-8')}</div>`}
      return `<div class="grid">${panel(tabs.find(x=>x[0]===t)?.[1]||t,json(d),'span-12')}</div>`}
    async function submitForm(form){const kind=form.dataset.kind,v=formValues(form);let url,method='POST',body=v;if(kind==='agent'){url='/register';body={agent_id:v.agent_id,url:v.url||null}}if(kind==='mcp'){url='/mcp/configs';method='PUT';body={namespace:v.namespace,server_id:v.server_id,config:JSON.parse(v.config)}}if(kind==='memory')url='/memory/add';if(kind==='wiki')url='/wiki/page';if(kind==='skill'){url='/skills';method='PUT'}if(kind==='file'){const fd=new FormData(form);const ns=fd.get('namespace');fd.delete('namespace');url='/files/upload?namespace='+encodeURIComponent(ns);body=fd}await api(url,{method,body});notify('保存成功');await go(current)}
    async function mutate(url,opt,message){if(!confirm(message+'？'))return;try{await api(url,opt);notify(message+'成功');go(current)}catch(e){notify(e.message,true)}}
    const removeAgent=id=>mutate('/agents/'+id,{method:'DELETE'},'删除 Agent');const removeMcp=id=>mutate('/mcp/configs?namespace=global&server_id='+id,{method:'DELETE'},'删除 MCP 配置');const removeMemory=id=>mutate('/memory/'+id,{method:'DELETE'},'删除记忆');const removeWiki=title=>mutate('/wiki/page?namespace=global&title='+title,{method:'DELETE'},'删除 Wiki 页面');const removeFile=file=>mutate('/files?namespace=global&file='+file,{method:'DELETE'},'删除文件');
    async function loadWiki(title){const form=$('form[data-kind="wiki"]');title=decodeURIComponent(title||form.title.value);if(!title)return notify('请先输入或选择标题',true);try{const d=await api('/wiki/page?namespace='+encodeURIComponent(form.namespace.value)+'&title='+encodeURIComponent(title));form.title.value=d.title;form.content.value=d.content;form.content.focus()}catch(e){notify(e.message,true)}}
    async function loadSkill(name){try{const d=await api('/skills/'+name);const form=$('form[data-kind="skill"]');form.name.value=d.name;form.content.value=d.content;form.content.focus()}catch(e){notify(e.message,true)}}
    async function downloadFile(file){try{const headers={};if(apiKey)headers.Authorization='Bearer '+apiKey;const response=await fetch('/files/download?namespace=global&file='+file,{headers});if(response.status===401)setApiKey();if(!response.ok){const detail=await response.json().catch(()=>({detail:response.statusText}));throw Error(detail.detail||response.statusText)}const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=decodeURIComponent(file).split('/').pop();document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url)}catch(e){notify(e.message,true)}}
    async function runAction(url,message){try{await api(url,{method:'POST'});notify(message);go(current)}catch(e){notify(e.message,true)}}
    const restoreBackup=name=>mutate('/backup/'+name+'/restore',{method:'POST'},'恢复此备份并覆盖当前数据');
    document.addEventListener('submit',async e=>{if(e.target.id==='key-form')return;e.preventDefault();const button=e.submitter;button.disabled=true;try{await submitForm(e.target)}catch(x){notify(x.message,true)}finally{button.disabled=false}});
    function setApiKey(){const dialog=$('#key-dialog');dialog.querySelector('input').value=apiKey;if(!dialog.open)dialog.showModal();dialog.querySelector('input').focus()}function clearApiKey(){apiKey='';sessionStorage.removeItem('dhub-api-key');$('#key-dialog').close();notify('访问密钥已清除');go(current)}
    $('#key-form').addEventListener('submit',e=>{e.preventDefault();apiKey=formValues(e.target).api_key.trim();if(apiKey)sessionStorage.setItem('dhub-api-key',apiKey);else sessionStorage.removeItem('dhub-api-key');$('#key-dialog').close();notify(apiKey?'访问密钥已应用':'访问密钥已清除');go(current)});
    window.addEventListener('hashchange',()=>{const target=(location.hash||'#overview').slice(1);if(target!==current)go(target)});
    async function boot(){navs();try{const h=await api('/health');$('#health-dot').className='dot '+(h.status==='ok'?'ok':'bad');$('#health-label').textContent=h.status==='ok'?'服务在线':'服务异常'}catch(e){$('#health-dot').className='dot bad';$('#health-label').textContent='连接失败'}go(current)}boot();
  </script>
</body>
</html>
