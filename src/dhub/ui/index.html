<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>d-hub Dashboard</title><style>:root{font:15px system-ui;color:#17202a;background:#f3f5f7;--accent:#ff6b00}*{box-sizing:border-box}body{margin:0}header{background:#17202a;color:#fff;padding:20px 28px}header b{font-size:22px}nav{display:flex;gap:7px;flex-wrap:wrap;padding:12px 24px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0}button{padding:8px 12px;border:1px solid #ccd3da;border-radius:6px;background:#fff;cursor:pointer}button.primary,.active{background:var(--accent);color:#fff;border-color:var(--accent)}main{padding:22px;max-width:1250px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:#fff;border-radius:10px;padding:17px;margin:10px 0;box-shadow:0 1px 5px #0001}pre{white-space:pre-wrap;overflow:auto;max-height:55vh;background:#f7f8f9;padding:10px}textarea,input,select{width:100%;padding:9px;margin:5px 0 10px;border:1px solid #ccd3da;border-radius:5px}textarea{min-height:130px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #eee}.ok{color:#16823b}.bad{color:#b42318}.muted{color:#68717a}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><header><b>d-hub</b><span class="muted"> · Multi-Agent Coordination Layer</span></header><nav id="nav"></nav><main id="app"></main><script>
const tabs=[['overview','总览'],['agents','Agent'],['mcp','MCP'],['memory','记忆'],['wiki','Wiki'],['skills','技能'],['files','文件'],['sync','同步'],['logs','日志'],['config','配置'],['backup','备份']];let current='overview';
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){if(opt.body&&!opt.headers)opt.headers={'Content-Type':'application/json'};let r=await fetch(url,opt),j=await r.json().catch(()=>({detail:r.statusText}));if(!r.ok)throw Error(j.detail||r.statusText);return j}function form(id){return Object.fromEntries(new FormData($('#'+id)).entries())}function navs(){nav.innerHTML=tabs.map(x=>`<button class="${x[0]===current?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function json(x){return `<pre>${esc(JSON.stringify(x,null,2))}</pre>`}function card(t,b){return `<section class=card><h2>${t}</h2>${b}</section>`}
async function go(t){current=t;navs();app.innerHTML=card('加载中…','');try{let d=await api('/dashboard/'+t);app.innerHTML=view(t,d)}catch(e){app.innerHTML=card('错误',`<span class=bad>${esc(e.message)}</span>`)}}
function view(t,d){if(t==='overview')return `<div class=grid>${card('服务状态',`<h1 class=${d.status==='ok'?'ok':'bad'}>${esc(d.status)}</h1><p>版本 ${esc(d.version)} · 运行 ${esc(d.uptime_seconds)} 秒</p>`)}${card('模块',d.modules.map(x=>`<button>${esc(x)}</button>`).join(' '))}${card('记忆后端',`<b>${esc(d.memory_backend)}</b><p class=muted>${esc(d.memory_error||'ready')}</p>`)}</div>`;
if(t==='agents')return card('注册 Agent',`<form id=f><input name=agent_id placeholder="agent_id" required><input name=url placeholder="回调 URL（可选）"><button class=primary>注册</button></form>`) + card('Agent 列表',json(d));
if(t==='mcp')return card('添加 MCP 配置',`<form id=f><input name=server_id placeholder="server id"><select name=namespace><option>global</option></select><textarea name=config>{"transport":"http","url":"http://127.0.0.1:8000/mcp"}</textarea><button class=primary>保存</button></form>`)+card('合并配置',json(d));
if(t==='memory')return card('添加记忆',`<form id=f><input name=namespace value=global><input name=agent_id value=shared><textarea name=content placeholder="记忆内容"></textarea><button class=primary>添加</button></form>`)+card('共识记忆',json(d));
if(t==='wiki')return card('编辑 Wiki',`<form id=f><input name=namespace value=global><input name=title placeholder="标题"><textarea name=content placeholder="# 页面内容"></textarea><button class=primary>保存</button></form>`)+card('页面',json(d));
if(t==='skills')return card('添加技能',`<form id=f><input name=namespace value=global><input name=name placeholder="技能名"><textarea name=content placeholder="SKILL.md"></textarea><button class=primary>保存</button></form>`)+card('技能',json(d));
if(t==='files')return card('上传文件',`<form id=f><input name=namespace value=global><input type=file name=file><button class=primary>上传</button></form>`)+card('文件',json(d));
if(t==='sync')return card('语义同步',`<button class=primary onclick="action('/sync/trigger')">立即同步</button>`)+card('历史',json(d));
if(t==='backup')return card('备份',`<button class=primary onclick="action('/backup')">立即备份</button>`)+card('备份历史',json(d));
return card(tabs.find(x=>x[0]===t)[1],json(d))}
async function action(url){try{alert(JSON.stringify(await api(url,{method:'POST'}),null,2));go(current)}catch(e){alert(e.message)}}
document.addEventListener('submit',async e=>{e.preventDefault();let v=form('f'),url='',method='POST',body=v;if(current==='agents'){url='/register';body={agent_id:v.agent_id,url:v.url||null}}if(current==='mcp'){url='/mcp/configs';method='PUT';body={namespace:v.namespace,server_id:v.server_id,config:JSON.parse(v.config)}}if(current==='memory')url='/memory/add';if(current==='wiki')url='/wiki/page';if(current==='skills'){url='/skills';method='PUT'}if(current==='files'){let fd=new FormData(e.target);url='/files/upload?namespace='+encodeURIComponent(fd.get('namespace'));fd.delete('namespace');try{await api(url,{method:'POST',body:fd});return go(current)}catch(x){return alert(x.message)}}try{await api(url,{method,body:JSON.stringify(body)});go(current)}catch(x){alert(x.message)}});navs();go('overview');
</script></body></html>
