services:
  dhub:
    build: .
    image: d-hub:0.3.0
    container_name: dhub
    restart: unless-stopped
    ports:
      - "10101:10101"
    volumes:
      - ./data:/opt/d-hub
    env_file:
      - .env
    environment:
      DHUB_ROOT: /opt/d-hub
      DHUB_PORT: "10101"
      DHUB_HOST: 0.0.0.0
    # 如需 mem0 向量后端，连 PostgreSQL（pgvector）：
    # depends_on:
    #   - pgvector
    #   - pgvector
    networks:
      - dhub-net

  # 可选：mem0 向量记忆后端（Qwen3-Embedding-8B 4096 维，需 IVFFlat）
  # pgvector:
  #   image: pgvector/pgvector:pg16
  #   container_name: dhub-pg
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: dhub
  #     POSTGRES_PASSWORD: ${PG_PASSWORD}
  #     POSTGRES_DB: dhub
  #   volumes:
  #     - ./pgdata:/var/lib/postgresql/data
  #   networks:
  #     - dhub-net

networks:
  dhub-net:
    driver: bridge
